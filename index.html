<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="熠徽账务" />
  
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231d4ed8'/%3E%3Ctext x='50' y='68' font-size='58' font-weight='700' text-anchor='middle' fill='%23fbbf24' font-family='sans-serif'%3E%E7%84%9A%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <title>熠徽建筑 · 账务管理系统</title>
  <style>/* ========== 基础变量 ========== */
:root{
  --c-primary:#1d4ed8;
  --c-primary-d:#1e3a8a;
  --c-primary-l:#dbeafe;
  --c-accent:#f97316;
  --c-accent-l:#ffedd5;
  --c-bg:#f1f5f9;
  --c-card:#ffffff;
  --c-text:#1e293b;
  --c-text-2:#475569;
  --c-text-3:#94a3b8;
  --c-border:#e2e8f0;
  --c-green:#16a34a;
  --c-green-l:#dcfce7;
  --c-red:#dc2626;
  --c-red-l:#fee2e2;
  --c-yellow:#ca8a04;
  --c-yellow-l:#fef9c3;
  --c-purple:#7c3aed;
  --c-purple-l:#ede9fe;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 4px 12px rgba(15,23,42,.08);
  --shadow-lg:0 12px 32px rgba(15,23,42,.16);
  --radius:12px;
  --radius-sm:8px;
  --sidebar-w:220px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:var(--c-bg);
  color:var(--c-text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:14px;outline:none;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;}

/* ========== 登录页 ========== */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 50%,#0ea5e9 100%);
  padding:20px;position:relative;overflow:hidden;
}
.login-wrap::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle at 20% 30%,rgba(251,191,36,.15),transparent 40%),
                   radial-gradient(circle at 80% 70%,rgba(255,255,255,.1),transparent 40%);
}
.login-card{
  position:relative;width:100%;max-width:380px;background:#fff;border-radius:16px;
  padding:36px 32px;box-shadow:var(--shadow-lg);
}
.login-logo{
  width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  font-size:28px;color:#fbbf24;font-weight:700;
}
.login-title{text-align:center;font-size:20px;font-weight:700;margin-bottom:4px;}
.login-sub{text-align:center;color:var(--c-text-3);font-size:13px;margin-bottom:24px;}
.login-hint{
  margin-top:18px;padding:12px 14px;background:var(--c-primary-l);border-radius:8px;
  font-size:12px;color:var(--c-primary-d);line-height:1.6;
}
.login-hint b{color:var(--c-primary);}

/* ========== 主布局 ========== */
.app-shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{
  width:var(--sidebar-w);background:linear-gradient(180deg,#1e293b 0%,#0f172a 100%);
  display:flex;flex-direction:column;flex-shrink:0;color:#cbd5e1;
}
.sidebar-brand{
  padding:18px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);
}
.brand-logo{
  width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);
  display:flex;align-items:center;justify-content:center;color:#fbbf24;font-weight:700;font-size:18px;flex-shrink:0;
}
.brand-name{font-size:15px;font-weight:600;color:#fff;line-height:1.2;}
.brand-sub{font-size:11px;color:#64748b;}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 8px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;
  color:#94a3b8;font-size:14px;cursor:pointer;margin-bottom:2px;transition:.15s;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#e2e8f0;}
.nav-item.active{background:linear-gradient(90deg,rgba(29,78,216,.25),rgba(14,165,233,.1));color:#fff;
  box-shadow:inset 2px 0 0 #fbbf24;}
.nav-icon{font-size:16px;width:18px;text-align:center;flex-shrink:0;}
.nav-badge{
  margin-left:auto;background:var(--c-accent);color:#fff;font-size:11px;font-weight:600;
  padding:1px 7px;border-radius:10px;min-width:18px;text-align:center;
}
.sidebar-foot{padding:10px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#64748b;text-align:center;}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{
  height:56px;background:#fff;border-bottom:1px solid var(--c-border);
  display:flex;align-items:center;gap:14px;padding:0 20px;flex-shrink:0;
}
.topbar-title{font-size:16px;font-weight:600;}
.company-switcher{
  display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--c-bg);
  border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;
}
.company-switcher:hover{border-color:var(--c-border);}
.company-switcher .dot{width:8px;height:8px;border-radius:50%;background:var(--c-green);}
.topbar-spacer{flex:1;}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--c-text-2);transition:.15s;
}
.icon-btn:hover{background:var(--c-bg);}
.user-chip{
  display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:20px;
  background:var(--c-bg);cursor:pointer;
}
.user-avatar{
  width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
}
.user-name{font-size:13px;font-weight:500;}
.user-role{font-size:11px;color:var(--c-text-3);}

.content{flex:1;overflow-y:auto;padding:20px;}
.content-padded{max-width:1280px;margin:0 auto;}

/* ========== 通用组件 ========== */
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:20px;font-weight:700;}
.page-sub{font-size:13px;color:var(--c-text-3);margin-top:2px;}

.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;
  font-size:13px;font-weight:500;transition:.15s;white-space:nowrap;border:1px solid transparent;
}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-d);}
.btn-ghost{background:#fff;border-color:var(--c-border);color:var(--c-text-2);}
.btn-ghost:hover{background:var(--c-bg);border-color:#cbd5e1;}
.btn-danger{background:var(--c-red);color:#fff;}
.btn-danger:hover{background:#b91c1c;}
.btn-accent{background:var(--c-accent);color:#fff;}
.btn-accent:hover{background:#ea580c;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-icon{padding:6px;width:30px;height:30px;justify-content:center;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.card{background:var(--c-card);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--c-border);}
.card-head{padding:14px 18px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card-title{font-weight:600;font-size:15px;}
.card-body{padding:16px 18px;}

.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

/* 统计卡片 */
.stat-card{padding:18px;display:flex;align-items:flex-start;gap:14px;position:relative;overflow:hidden;}
.stat-icon{
  width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.stat-meta{flex:1;min-width:0;}
.stat-label{font-size:12px;color:var(--c-text-3);margin-bottom:4px;}
.stat-value{font-size:22px;font-weight:700;letter-spacing:-.5px;}
.stat-foot{font-size:12px;color:var(--c-text-3);margin-top:6px;}
.trend-up{color:var(--c-green);}
.trend-down{color:var(--c-red);}

/* 表格 */
.table-wrap{overflow-x:auto;}
table.data{width:100%;border-collapse:collapse;font-size:13px;}
table.data th{
  text-align:left;padding:10px 12px;background:var(--c-bg);color:var(--c-text-3);
  font-weight:500;font-size:12px;border-bottom:1px solid var(--c-border);white-space:nowrap;
}
table.data td{padding:11px 12px;border-bottom:1px solid var(--c-border);vertical-align:middle;}
table.data tr:hover td{background:#fafbfc;}
table.data tr:last-child td{border-bottom:none;}
.cell-amount{font-variant-numeric:tabular-nums;font-weight:600;}
.cell-amount.income{color:var(--c-green);}
.cell-amount.expense{color:var(--c-red);}
.cell-note{color:var(--c-text-2);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 流水日期分组行 */
table.data tr.day-row td{background:var(--c-bg);padding:8px 12px;font-size:12px;}
table.data tr.day-row td b{font-size:13px;}
.day-sum{color:var(--c-text-3);margin-left:8px;font-size:11px;}
.day-row .tag{margin-left:6px;}
/* 窄屏(手机)优化 */
table.data td:last-child{white-space:nowrap;}
@media(max-width:640px){
  table.data{font-size:12px;}
  table.data th{padding:8px;font-size:11px;}
  table.data td{padding:9px 8px;}
  .cell-note{max-width:130px;}
  .btn-sm{padding:4px 9px;}
  .modal-mask{padding:10px;align-items:flex-end;}
  .modal{max-height:92vh;border-radius:16px 16px 0 0;}
  .modal-foot{padding:12px 14px;}
  .modal-foot .btn{flex:1;justify-content:center;padding:11px 14px;font-size:14px;}
}

.tag{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;
  font-size:11px;font-weight:500;
}
.tag-green{background:var(--c-green-l);color:var(--c-green);}
.tag-red{background:var(--c-red-l);color:var(--c-red);}
.tag-yellow{background:var(--c-yellow-l);color:var(--c-yellow);}
.tag-blue{background:var(--c-primary-l);color:var(--c-primary-d);}
.tag-gray{background:#f1f5f9;color:var(--c-text-2);}
.tag-purple{background:var(--c-purple-l);color:var(--c-purple);}

/* 表单 */
.form-row{margin-bottom:14px;}
.form-label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--c-text-2);}
.form-label .req{color:var(--c-red);}
.form-control{
  width:100%;padding:9px 12px;border:1px solid var(--c-border);border-radius:8px;
  font-size:14px;background:#fff;transition:.15s;
}
.form-control:focus{border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(29,78,216,.12);}
textarea.form-control{resize:vertical;min-height:70px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:560px){.form-grid{grid-template-columns:1fr;}}
.form-hint{font-size:12px;color:var(--c-text-3);margin-top:4px;}

/* 模态框 */
.modal-mask{
  position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;
  animation:fade .15s;
}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal{
  background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:90vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .2s;
}
@keyframes pop{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal.lg{max-width:780px;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:16px;font-weight:600;}
.modal-body{padding:20px;overflow-y:auto;flex:1;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--c-border);display:flex;justify-content:flex-end;gap:8px;}

/* Toast */
#toast-root{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:#1e293b;color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;min-width:200px;
  animation:slideIn .25s;
}
@keyframes slideIn{from{transform:translateX(120%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.toast.success{background:var(--c-green);}
.toast.error{background:var(--c-red);}
.toast.warn{background:var(--c-yellow);}

/* 工具类 */
.flex{display:flex;}
.flex-1{flex:1;}
.gap-8{gap:8px;}
.gap-12{gap:12px;}
.gap-16{gap:16px;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.justify-end{justify-content:flex-end;}
.flex-wrap{flex-wrap:wrap;}
.mt-8{margin-top:8px;}
.mt-16{margin-top:16px;}
.mb-8{margin-bottom:8px;}
.mb-16{margin-bottom:16px;}
.text-sm{font-size:12px;}
.text-muted{color:var(--c-text-3);}
.text-bold{font-weight:600;}
.text-right{text-align:right;}
.text-center{text-align:center;}
.w-full{width:100%;}

/* 空状态 */
.empty{
  padding:40px 20px;text-align:center;color:var(--c-text-3);
}
.empty-icon{font-size:42px;margin-bottom:10px;opacity:.5;}

/* 筛选条 */
.filter-bar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;
  padding:12px;background:#fff;border-radius:10px;border:1px solid var(--c-border);
}
.filter-bar .form-control{width:auto;min-width:140px;padding:6px 10px;font-size:13px;}
.search-input{
  position:relative;flex:1;min-width:180px;
}
.search-input input{width:100%;padding:6px 10px 6px 30px;border:1px solid var(--c-border);border-radius:6px;font-size:13px;}
.search-input::before{
  content:"🔍";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5;
}

/* 进度条 */
.progress{height:6px;background:var(--c-bg);border-radius:3px;overflow:hidden;}
.progress-bar{height:100%;background:linear-gradient(90deg,#1d4ed8,#0ea5e9);border-radius:3px;transition:width .4s;}

/* 图表 */
.chart-box{padding:8px;}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:200px;padding:10px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
.bar{width:60%;background:linear-gradient(180deg,#0ea5e9,#1d4ed8);border-radius:4px 4px 0 0;min-height:2px;position:relative;transition:height .4s;}
.bar.expense{background:linear-gradient(180deg,#fb923c,#dc2626);}
.bar-label{font-size:11px;color:var(--c-text-3);}
.bar-val{font-size:11px;font-weight:600;}

.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.donut{position:relative;width:160px;height:160px;flex-shrink:0;}
.donut svg{display:block;width:160px;height:160px;}
.donut-center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:11px;color:var(--c-text-3);
}
.donut-center b{font-size:18px;color:var(--c-text);}
.legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:140px;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.legend-val{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;}

/* 项目卡片 */
.project-card{padding:16px;cursor:pointer;transition:.15s;}
.project-card:hover{box-shadow:var(--shadow);}
.project-name{font-size:15px;font-weight:600;margin-bottom:4px;}
.project-client{font-size:12px;color:var(--c-text-3);margin-bottom:10px;}
.project-stats{display:flex;justify-content:space-between;font-size:12px;}
.project-stat-label{color:var(--c-text-3);}
.project-stat-val{font-weight:600;font-variant-numeric:tabular-nums;}

/* 票据墙 */
.bill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.bill-tile{
  border:1px solid var(--c-border);border-radius:10px;overflow:hidden;cursor:pointer;
  background:#fff;transition:.15s;
}
.bill-tile:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
.bill-thumb{width:100%;aspect-ratio:1;object-fit:cover;background:var(--c-bg);}
.bill-meta{padding:8px;font-size:11px;}
.bill-meta .t{font-weight:500;color:var(--c-text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bill-meta .d{color:var(--c-text-3);margin-top:2px;}

/* 移动端汉堡 */
.menu-toggle{display:none;}

@media(max-width:760px){
  :root{--sidebar-w:0px;}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:200;width:240px;
    transform:translateX(-100%);transition:transform .25s;
  }
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg);}
  .menu-toggle{display:flex;}
  .topbar{padding:0 12px;gap:8px;}
  .content{padding:12px;}
  .user-name{display:none;}
  .sidebar-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;display:none;
  }
  .sidebar-mask.show{display:block;}
}

/* 打印 */
@media print{
  .sidebar,.topbar,.no-print{display:none !important;}
  .content{overflow:visible;padding:0;}
  .card{box-shadow:none;border-color:#ccc;}
}

/* ========== 同步状态按钮 ========== */
.sync-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px !important;
  font-size: 12px;
  height: 32px;
  border: 1px solid var(--c-border);
  border-radius: 16px;
  background: var(--c-bg);
}
.sync-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.sync-dot.online {
  background: var(--c-green);
  box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18);
  animation: pulse 2s infinite;
}
.sync-dot.offline {
  background: var(--c-yellow);
  box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.18);
}
.sync-dot.local {
  background: var(--c-primary-d);
  box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.18);
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18); }
  50%  { box-shadow: 0 0 0 6px rgba(22, 163, 74, 0.08); }
  100% { box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18); }
}
.sync-label { color: var(--c-text-2); }

/* PWA 全屏适配 - iPhone 刘海/底部 */
@supports (padding: env(safe-area-inset-top)) {
  .topbar { padding-top: env(safe-area-inset-top); }
  .sidebar { padding-top: env(safe-area-inset-top); }
  .content { padding-bottom: env(safe-area-inset-bottom); }
}

/* 充电桩施工进度卡 */
.grid-steps {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.stage-card {
  padding: 14px 10px;
  border: 1px solid var(--c-border);
  border-radius: 10px;
  text-align: center;
  background: #fff;
  transition: all .2s;
}
.stage-card.done {
  border-color: var(--c-green);

<body>
  <div id="app"></div>

  <div id="toast-root"></div>
  <input type="file" id="hidden-file-input" hidden />
  <script>/* ==========================================================================
   熠徽建筑 · 账务管理系统  v1.0
   纯前端单页应用,数据存储于浏览器 localStorage
   ========================================================================== */
'use strict';

/* ========== 工具函数 ========== */
var $ = (s, el = document) => el.querySelector(s);
var $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

const fmt = {
  money(n, withSymbol = true) {
    if (n == null || isNaN(n)) n = 0;
    const s = Math.abs(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (withSymbol ? '¥' : '') + (n < 0 ? '-' : '') + s;
  },
  num(n) { return (n || 0).toLocaleString('zh-CN', { maximumFractionDigits: 2 }); },
  date(s) {
    if (!s) return '';
    const d = new Date(s);
    return `${d.getMonth() + 1}月${d.getDate()}日`;
  },
  dateFull(s) {
    if (!s) return '';
    const d = new Date(s);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  },
  today() { return fmt.dateFull(new Date()); },
  month(s) {
    if (!s) return '';
    const d = new Date(s);
    return `${d.getFullYear()}年${d.getMonth() + 1}月`;
  },
  short(s) {
    if (!s) return '';
    const d = new Date(s);
    return `${d.getMonth() + 1}/${d.getDate()}`;
  },
  time(s) {
    if (!s) return '';
    const d = new Date(s);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  },
  datetime(s) {
    if (!s) return '';
    const d = new Date(s);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  },
};

const dates = {
  today() { return fmt.today(); },
  now() { return new Date().toISOString(); },
  monthStart() {
    const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
  },
  monthEnd() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()}`;
  },
  addDays(s, n) { const d = new Date(s); d.setDate(d.getDate() + n); return fmt.dateFull(d); },
  diffDays(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); },
  inRange(s, start, end) {
    if (!s) return false;
    if (start && s < start) return false;
    if (end && s > end) return false;
    return true;
  },
};

/* ========== 数据层 ==========
   优先用云端数据库(Supabase),localStorage 作为离线缓存兜底。
   DB.online 表示是否已连上云端。
*/
const DB = {
  KEY: 'yihui_accounting_v1',
  DRAFT_KEY: 'yihui_drafts',
  data: null,
  online: false,
  token: null,        // 登录后的访问令牌
  currentUser: null,   // 登录用户(避免与 user(id) 方法冲突)
  _saving: false,
  _dirty: false,
  _saveTimer: null,   // 防抖定时器
  _retryTimer: null,  // 离线重试定时器
  syncLog: [],        // 同步日志:最近 20 条 [{t, action, ok, msg}]
  lastSyncAt: null,   // 上次成功同步时间
  onSyncChange: null, // 同步状态变化回调(供 UI 更新)

  // 记录一条同步日志
  _log(action, ok, msg) {
    const entry = { t: new Date().toISOString(), action, ok, msg: msg || '' };
    this.syncLog.unshift(entry);
    if (this.syncLog.length > 20) this.syncLog.length = 20;
    this.lastSyncAt = ok ? entry.t : this.lastSyncAt;
    if (typeof this.onSyncChange === 'function') {
      try { this.onSyncChange(); } catch (e) {}
    }
  },

  // 网络状态变化监听(联网后自动同步)
  _bindNetwork() {
    if (this._netBound) return;
    this._netBound = true;
    window.addEventListener('online', async () => {
      console.log('已联网,开始同步');
      if (this.token) { this.online = true; await this.syncNow(); }
    });
    window.addEventListener('offline', () => {
      console.log('已离线,改用本地缓存');
      this.online = false;
      this._log('offline', false, '网络已断开,数据暂存本地');
    });
    // 页面隐藏前/关闭前最后保存一次
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && this._dirty) {
        this._persistLocal();
        if (this.token && !this.token.startsWith('local-')) this._cloudSave();
      }
    });
    window.addEventListener('beforeunload', () => {
      if (this._dirty) {
        this._persistLocal();
        // 独立模式不需要 sendBeacon
        if (this.token && !this.token.startsWith('local-')) {
          try {
            const blob = new Blob([JSON.stringify({ data: this.data })], { type: 'application/json' });
            navigator.sendBeacon('/api/db', blob);
          } catch (e) {}
        }
      }
    });
  },

  async load() {
    this._bindNetwork();
    // 1) 先读本地缓存,让 UI 立刻有数据可用
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) this.data = JSON.parse(raw);
    } catch (e) { console.warn('本地缓存读取失败', e); }

    // 2) 没有本地数据,初始化种子
    if (!this.data) { this.data = this.seed(); }
    this._repairData();

    // 3) 独立模式或无 token,不拉云端
    if (!this.token || this.token.startsWith('local-')) return;
    try {
      const r = await fetch('/api/db', { headers: { 'X-Access-Token': this.token } });
      if (r.ok) {
        const j = await r.json();
        if (j.ok && j.data && Object.keys(j.data).length > 0) {
          this.data = j.data;
          this._repairData();
          this.online = true;
          this._persistLocal();
          this._log('pull', true, '已从云端拉取最新数据');
        } else if (j.ok) {
          await this._cloudSave();
          this.online = true;
        }
      } else if (r.status === 401) {
        this.online = false;
        this.token = null;
        sessionStorage.removeItem('yihui_token');
        this._log('pull', false, '登录已失效,请重新登录');
      }
    } catch (e) {
      console.warn('云端加载失败,使用本地数据', e);
      this.online = false;
      this._log('pull', false, '网络错误,使用本地缓存');
    }
  },

  // 写入 localStorage
  _persistLocal() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); }
    catch (e) { console.warn('本地缓存写入失败', e); }
  },

  // 修复历史数据:补齐缺失的 id(旧版"记一笔"生成的流水无 id,导致无法编辑/删除)
  _repairData() {
    if (!this.data) return;
    (this.data.transactions || []).forEach(t => { if (!t.id) t.id = uid('tx'); });
  },

  // 保存:本地立刻落盘 + 防抖同步到云端(避免高频修改打爆 API)
  save() {
    this._persistLocal();
    this._dirty = true;
    Backup.autosave(); // 每天首次改动自动快照一次
    // 独立模式(本地 token)不需要云端同步
    if (this.token && this.token.startsWith('local-')) return;
    if (this._saveTimer) clearTimeout(this._saveTimer);
    // 防抖:800ms 内连续修改只发一次
    this._saveTimer = setTimeout(() => {
      this._saveTimer = null;
      if (this.token) this._cloudSave();
    }, 800);
  },

  // 手动同步:立即拉云端 + 推本地
  async syncNow() {
    if (!this.token) {
      this._log('sync', false, '未登录');
      return { ok: false, error: '未登录' };
    }
    // 独立模式:数据全在本地,直接返回成功
    if (this.token.startsWith('local-')) {
      this._log('sync', true, '独立模式:数据已保存在本地');
      return { ok: true, standalone: true };
    }
    this._log('sync', true, '开始手动同步...');
    // 先拉云端
    try {
      const r = await fetch('/api/db', { headers: { 'X-Access-Token': this.token } });
      if (r.status === 401) {
        this.online = false; this.token = null;
        sessionStorage.removeItem('yihui_token');
        this._log('sync', false, '登录已失效');
        return { ok: false, error: '未授权' };
      }
      if (r.ok) {
        const j = await r.json();
        if (j.ok && j.data && Object.keys(j.data).length > 0) {
          // 云端有数据,合并策略:以云端 session 替换本地(防止本地 session 与云端不一致)
          const localSession = this.data.session;
          this.data = j.data;
          if (localSession) this.data.session = localSession;
          this._persistLocal();
          this._log('pull', true, '云端数据已同步到本地');
        }
      }
    } catch (e) {
      this._log('sync', false, '拉取失败:' + e.message);
      this.online = false;
      return { ok: false, error: e.message };
    }
    // 再推本地
    const ok = await this._cloudSave();
    return { ok };
  },

  async _cloudSave() {
    if (!this.token) return false;
    this._saving = true;
    try {
      const r = await fetch('/api/db', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Access-Token': this.token },
        body: JSON.stringify({ data: this.data }),
      });
      if (r.status === 401) {
        this.online = false;
        this.token = null;
        sessionStorage.removeItem('yihui_token');
        this._log('push', false, '登录已失效');
        return false;
      }
      if (r.ok) {
        this.online = true;
        this._dirty = false;
        this._log('push', true, '本地数据已同步到云端');
        return true;
      }
      this._log('push', false, 'HTTP ' + r.status);
      return false;
    } catch (e) {
      console.warn('云端同步失败,已存本地待恢复', e);
      this.online = false;
      this._log('push', false, '网络错误,已存本地');
      // 30 秒后自动重试一次
      if (this._retryTimer) clearTimeout(this._retryTimer);
      this._retryTimer = setTimeout(() => {
        this._retryTimer = null;
        if (navigator.onLine && this.token) this._cloudSave();
      }, 30000);
      return false;
    } finally {
      this._saving = false;
    }
  },

  // 登录:优先调后端验证密码;后端不存在则走独立模式(本地验证)
  async login(username, password) {
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (r.ok) {
        const j = await r.json();
        if (!j.ok) return { ok: false, error: j.error };
        this.token = j.token;
        this.currentUser = j.user;
        sessionStorage.setItem('yihui_token', this.token);
        await this.load();
        const cid = this.accessibleCompanyIds()[0];
        this.data.session = { userId: j.user.id, companyId: cid };
        this._persistLocal();
        return { ok: true, user: j.user };
      }
      // API 返回 404 等非 OK → 独立模式
      throw new Error('NO_API');
    } catch (e) {
      // ===== 独立模式:无后端,本地验证登录 =====
      // 单文件版:以 seed 为准,确保默认账号始终可用
      const seedData = this.seed();
      let localData = null;
      try {
        const raw = localStorage.getItem(this.KEY);
        if (raw) localData = JSON.parse(raw);
      } catch (e2) {}
      if (!localData || localData.version !== seedData.version) {
        // 本地无数据或版本不匹配 → 用 seed 初始化
        this.data = seedData;
        this._persistLocal();
      } else {
        this.data = localData;
        // 合并 seed 的默认账号(防止旧数据丢失默认账号)
        const existingNames = (this.data.users || []).map(u => u.username);
        (seedData.users || []).forEach(su => {
          if (!existingNames.includes(su.username)) {
            this.data.users = this.data.users || [];
            this.data.users.push(su);
          } else {
            // 同步 seed 默认账号的密码(防止旧密码覆盖)
            const u = this.data.users.find(x => x.username === su.username);
            if (u && su.role === 'boss') { u.password = su.password; }
          }
        });
        this._persistLocal();
      }
      // 本地 users 里找匹配
      let user = (this.data.users || []).find(u => u.username === username && u.password === password);
      if (!user) return { ok: false, error: '用户名或密码错误' };
      // 独立模式:生成本地 token,标记 online=false(纯本地)
      this.token = 'local-' + user.id;
      this.currentUser = { id: user.id, username: user.username, name: user.name, role: user.role };
      this.online = false; // 纯本地模式,不走云端
      sessionStorage.setItem('yihui_token', this.token);
      const cid = this.accessibleCompanyIds()[0];
      this.data.session = { userId: user.id, companyId: cid };
      this._persistLocal();
      return { ok: true, user: this.currentUser, standalone: true };
    }
  },

  logout() {
    this.token = null;
    this.currentUser = null;
    this.online = false;
    sessionStorage.removeItem('yihui_token');
    if (this.data) { this.data.session = null; this._persistLocal(); }
    App.render();
  },

  accessibleCompanyIds() {
    const u = this.user || (this.data && this.data.session);
    if (!u) return [];
    // boss 默认看全部
    if (this.user && this.user.role === 'boss') return this.data.companies.map(c => c.id);
    // 否则查 users 表
    const userObj = this.data.users.find(x => x.id === (this.user ? this.user.id : this.data.session.userId));
    if (!userObj) return this.data.companies.length ? [this.data.companies[0].id] : [];
    if (userObj.role === 'boss') return this.data.companies.map(c => c.id);
    if (userObj.role === 'accountant') return userObj.companyIds || [];
    return userObj.companyId ? [userObj.companyId] : [];
  },
  reset() {
    UI.confirm('确定要清空所有数据并恢复演示数据吗?<br><span style="color:var(--c-text-3);">重置前会自动生成快照,误操作可在「本地快照」里恢复。</span>', () => {
      Backup.create('before-danger'); // 重置前强制快照,误操作可恢复
      localStorage.removeItem(this.KEY);
      this.data = this.seed();
      this.save();
      UI.toast('已重置为演示数据', 'success');
      App.render();
    }, { title: '重置数据', okText: '重置' });
  },
  export() {
    const blob = new Blob([JSON.stringify(this.data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `熠徽账务备份_${fmt.today()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  },
  import(file, cb) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const obj = JSON.parse(r.result);
        if (!obj.companies || !obj.users) throw new Error('格式不对');
        Backup.create('before-danger'); // 导入覆盖前强制快照
        this.data = obj;
        this.save();
        UI.toast('导入成功', 'success');
        cb && cb();
      } catch (e) { UI.toast('文件格式不正确,导入失败', 'error'); }
    };
    r.readAsText(file);
  },
  companies() { return this.data.companies; },
  company(id) { return this.data.companies.find(c => c.id === id); },
  users() { return this.data.users; },
  user(id) { return this.data.users.find(u => u.id === id); },
  categories(companyId, type) {
    const c = this.company(companyId);
    if (!c) return [];
    return (c.categories && c.categories[type]) || [];
  },
  category(companyId, type, id) {
    return this.categories(companyId, type).find(c => c.id === id);
  },
  txns(filterFn) {
    return this.data.transactions.filter(filterFn || (() => true));
  },
  projects(companyId) { return this.data.projects.filter(p => p.companyId === companyId); },
  project(id) { return this.data.projects.find(p => p.id === id); },
  employees(companyId) { return this.data.employees.filter(e => e.companyId === companyId); },
  employee(id) { return this.data.employees.find(e => e.id === id); },
  bills(companyId) { return this.data.bills.filter(b => b.companyId === companyId); },
  // 新增:客户/供应商/合同/日报/库存/发票
  customers(companyId) { return (this.data.customers || []).filter(c => c.companyId === companyId); },
  customer(id) { return (this.data.customers || []).find(c => c.id === id); },
  suppliers(companyId) { return (this.data.suppliers || []).filter(s => s.companyId === companyId); },
  supplier(id) { return (this.data.suppliers || []).find(s => s.id === id); },
  contracts(companyId) { return (this.data.contracts || []).filter(c => c.companyId === companyId); },
  contract(id) { return (this.data.contracts || []).find(c => c.id === id); },
  dailyLogs(companyId) { return (this.data.dailyLogs || []).filter(d => d.companyId === companyId); },
  inventory(companyId) { return (this.data.inventory || []).filter(i => i.companyId === companyId); },
  invoices(companyId) { return (this.data.invoices || []).filter(i => i.companyId === companyId); },
  vehicles(companyId) { return (this.data.vehicles || []).filter(v => v.companyId === companyId); },
  vehicle(id) { return (this.data.vehicles || []).find(v => v.id === id); },
  fuelLogs(companyId) { return (this.data.fuelLogs || []).filter(f => f.companyId === companyId); },

  add(entity, arr) { this.data[arr].push(entity); this.save(); return entity; },
  update(entity, arr) {
    const i = this.data[arr].findIndex(x => x.id === entity.id);
    if (i >= 0) { this.data[arr][i] = entity; this.save(); }
    return entity;
  },
  remove(id, arr) {
    const i = this.data[arr].findIndex(x => x.id === id);
    if (i >= 0) { this.data[arr].splice(i, 1); this.save(); return true; }
    return false;
  },

  seed() {

      expense: [
        { id: 'ce_mat', name: '建筑材料', icon: '🧱', color: '#dc2626' },
        { id: 'ce_labor', name: '人工工资', icon: '👷', color: '#2563eb' },
        { id: 'ce_mach', name: '机械租赁', icon: '🚜', color: '#7c3aed' },
        { id: 'ce_sub', name: '分包款', icon: '📦', color: '#0891b2' },
        { id: 'ce_dining', name: '餐饮伙食', icon: '🍱', color: '#ea580c' },
        { id: 'ce_transport', name: '交通运输', icon: '🚚', color: '#16a34a' },
        { id: 'ce_office', name: '办公用品', icon: '📋', color: '#64748b' },

        // 充电桩安装专属分类

        { id: 'ce_permit', name: '报装报检', icon: '📑', color: '#64748b' },
      ],
      income: [
        { id: 'ci_proj', name: '工程款', icon: '💰', color: '#16a34a' },
        { id: 'ci_sub', name: '分包回款', icon: '📑', color: '#0891b2' },

/* ========== 表单草稿自动保存 ==========
   用法:给表单加 data-draft="key" 属性,FormDraft 会自动:
   - input/change 时实时缓存到 sessionStorage
   - 表单关闭/重新打开时自动恢复
   - 提交成功后调用 FormDraft.clear(key) 清除
*/
const FormDraft = {
  _getAll() {
    try { return JSON.parse(sessionStorage.getItem(DB.DRAFT_KEY) || '{}'); }
    catch (e) { return {}; }
  },
  _save(obj) { sessionStorage.setItem(DB.DRAFT_KEY, JSON.stringify(obj)); },

  save(key, data) {
    const all = this._getAll();
    all[key] = { data, ts: Date.now() };
    this._save(all);
  },
  load(key) {
    const all = this._getAll();
    return all[key] ? all[key].data : null;
  },
  clear(key) {
    const all = this._getAll();
    delete all[key];
    this._save(all);
  },
  clearAll() { sessionStorage.removeItem(DB.DRAFT_KEY); },

  // 自动绑定:监听表单内所有 [name] 字段,实时缓存
  // formEl: form 元素; key: 草稿键
  bind(formEl, key) {
    if (!formEl) return;
    // 恢复
    const saved = this.load(key);
    if (saved) {
      Object.entries(saved).forEach(([name, val]) => {
        const el = formEl.querySelector(`[name="${name}"]`);
        if (!el) return;
        if (el.type === 'checkbox') el.checked = !!val;
        else if (el.type === 'radio') {
          const r = formEl.querySelector(`[name="${name}"][value="${val}"]`);
          if (r) r.checked = true;
        } else el.value = val;
      });
      UI.toast('已自动恢复未提交的草稿', 'info');
    }
    // 监听输入(防抖 300ms)
    let timer = null;
    const collect = () => {
      const data = {};
      formEl.querySelectorAll('[name]').forEach(el => {
        if (!el.name) return;
        if (el.type === 'checkbox') data[el.name] = el.checked;
        else if (el.type === 'radio') { if (el.checked) data[el.name] = el.value; }
        else data[el.name] = el.value;
      });
      this.save(key, data);
    };
    formEl.addEventListener('input', () => {
      if (timer) clearTimeout(timer);
      timer = setTimeout(collect, 300);
    });
    formEl.addEventListener('change', collect);
    // 提交成功后清掉(由调用方处理,这里只 hook)
    formEl.addEventListener('submit', () => this.clear(key));
  },
};

/* ========== UI 工具 ========== */
const UI = {
  toast(msg, type = '') {
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : type === 'warn' ? '⚠' : 'ℹ';
    t.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
    $('#toast-root').appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(120%)'; setTimeout(() => t.remove(), 300); }, 2800);
  },
  modal({ title, body, foot, size = '' }) {
    const root = $('#modal-root');
    root.innerHTML = `
      <div class="modal-mask" data-close>
        <div class="modal ${size}" onclick="event.stopPropagation()">
          <div class="modal-head"><div class="modal-title">${title}</div>
            <button class="icon-btn" data-close>✕</button></div>
          <div class="modal-body">${body}</div>
          ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
        </div>
      </div>`;
    const close = () => { root.innerHTML = ''; };
    root.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
    return { root, close };
  },
  confirm(msg, onOk, opts = {}) {
    const m = this.modal({
      title: opts.title || '请确认',
      body: `<div style="padding:8px 0;font-size:14px;line-height:1.7;">${msg}</div>`,
      foot: `<button class="btn btn-ghost" data-close>${opts.cancelText || '取消'}</button>
             <button class="btn btn-danger" data-ok>${opts.okText || '确认'}</button>`,
    });
    m.root.querySelector('[data-ok]').onclick = () => { m.close(); onOk(); };
  },
  formModal({ title, fields, size = '', onSubmit, data = {}, submitText = '保存', draftKey }) {
    const renderField = (f) => {
      let val = data[f.key] != null ? data[f.key] : (f.default != null ? f.default : '');
      // 草稿覆盖
      if (draftKey) {
        const d = FormDraft.load(draftKey);
        if (d && d[f.key] != null) val = d[f.key];
      }
      const req = f.required ? '<span class="req">*</span>' : '';
      if (f.type === 'html') {
        return f.html || '';
      }
      if (f.type === 'select') {
        const opts = (f.options || []).map(o => `<option value="${o.value}" ${String(o.value) === String(val) ? 'selected' : ''}>${o.label}</option>`).join('');
        return `<div class="form-row"><label class="form-label">${f.label}${req}</label>
          <select class="form-control" name="${f.key}">${opts}</select>${f.hint ? `<div class="form-hint">${f.hint}</div>` : ''}</div>`;
      }
      if (f.type === 'textarea') {
        return `<div class="form-row"><label class="form-label">${f.label}${req}</label>
          <textarea class="form-control" name="${f.key}" rows="${f.rows || 3}">${val}</textarea></div>`;
      }
      const inputType = f.type || 'text';
      return `<div class="form-row"><label class="form-label">${f.label}${req}</label>
        <input type="${inputType}" class="form-control" name="${f.key}" value="${val}" ${f.step ? `step="${f.step}"` : ''} ${f.placeholder ? `placeholder="${f.placeholder}"` : ''} ${inputType === 'number' ? 'inputmode="decimal"' : ''}>
        ${f.hint ? `<div class="form-hint">${f.hint}</div>` : ''}</div>`;
    };
    const fieldRows = fields.map(f => {
      if (f.type === 'row' && f.fields) {
        return `<div class="form-grid">${f.fields.map(renderField).join('')}</div>`;
      }
      return renderField(f);
    }).join('');
    const m = this.modal({
      title, size,
      body: `<form id="modal-form" onsubmit="return false;">${fieldRows}</form>`,
      foot: `<button class="btn btn-ghost" data-close>取消</button>
             <button class="btn btn-primary" data-submit>${submitText}</button>`,
    });
    // 自动草稿
    if (draftKey) {
      FormDraft.bind(m.root.querySelector('#modal-form'), draftKey);
    }
    m.root.querySelector('[data-submit]').onclick = (e) => {
      e.preventDefault();
      const form = m.root.querySelector('#modal-form');
      const out = {};
      let ok = true;
      fields.forEach(f => {
        const arr = (f.fields ? f.fields : [f]);
        arr.forEach(ff => {
          const el = form.querySelector(`[name="${ff.key}"]`);
          if (!el) return;
          let v = el.value;
          if (ff.type === 'number') v = v === '' ? null : parseFloat(v);
          out[ff.key] = v;
          if (ff.required && (v === '' || v == null)) { el.style.borderColor = 'var(--c-red)'; ok = false; }
        });
      });
      if (!ok) { UI.toast('请填写必填项', 'warn'); return; }
      if (draftKey) FormDraft.clear(draftKey);
      m.close();
      onSubmit(out);
    };
    return m;
  },
  picModal(src) {
    this.modal({ title: '查看票据', body: `<img src="${src}" style="width:100%;border-radius:8px;">` });
  },
  empty(icon, text) {
    return `<div class="empty"><div class="empty-icon">${icon}</div><div>${text}</div></div>`;
  },
};

/* ========== 图片处理 ========== */
const ImageUtil = {
  compress(file, maxW = 1000, quality = 0.7) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = r.result;
      };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  },
};

/* ========== 本地快照备份(防丢数据) ========== */
const Backup = {
  KEY: 'yihui_backups_v1',
  DAY_KEY: 'yihui_last_autobak',
  MAX: 10,
  REASON_LABEL: { auto: '自动', manual: '手动', 'before-danger': '操作前' },
  list() {
    try { return JSON.parse(localStorage.getItem(this.KEY)) || []; }
    catch (e) { return []; }
  },
  _write(arr) {
    try { localStorage.setItem(this.KEY, JSON.stringify(arr)); return true; }
    catch (e) {}
    // 存储空间不足时,逐步丢弃旧快照重试
    while (arr.length > 1) {
      arr.length = Math.floor(arr.length / 2);
      try { localStorage.setItem(this.KEY, JSON.stringify(arr)); return true; } catch (e) {}
    }
    console.warn('快照写入失败:本机存储空间不足');
    return false;
  },
  create(reason) {
    let snapData;
    try { snapData = JSON.stringify(DB.data); } catch (e) { return false; }
    const arr = this.list();
    const snap = { ts: Date.now(), reason: reason || 'manual', size: snapData.length, data: snapData };
    // 同一天同一类型只保留最新一份
    const day = fmt.dateFull(snap.ts);
    const dup = arr.findIndex(b => b.reason === snap.reason && fmt.dateFull(b.ts) === day);
    if (dup >= 0) arr.splice(dup, 1);
    arr.unshift(snap);
    while (arr.length > this.MAX) arr.pop();
    return this._write(arr) ? snap : false;
  },
  autosave() {
    const today = fmt.today();
    let last = null;
    try { last = localStorage.getItem(this.DAY_KEY); } catch (e) {}
    if (last === today) return;
    if (this.create('auto')) {
      try { localStorage.setItem(this.DAY_KEY, today); } catch (e) {}
    }
  },
  restore(ts) {
    const hit = this.list().find(b => b.ts === ts);
    if (!hit) return false;
    try {
      const obj = JSON.parse(hit.data);
      if (!obj || !obj.companies || !obj.users) return false;
      this.create('before-danger'); // 恢复前先快照当前数据,可反悔
      const session = DB.data && DB.data.session;
      DB.data = obj;
      if (session) DB.data.session = session;
      DB._repairData();
      DB._persistLocal();
      DB.save();
      return true;
    } catch (e) { return false; }
  },
  remove(ts) {
    return this._write(this.list().filter(b => b.ts !== ts));
  },
};

/* ========== Excel/CSV 导出 ========== */
const Export = {
  csv(filename, headers, rows) {
    const esc = (v) => {
      const s = String(v == null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lines = [headers.map(esc).join(','), ...rows.map(r => r.map(esc).join(','))];
    const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
    UI.toast('已导出 ' + filename, 'success');
  },
};

    catch (e) { console.error(e); main.innerHTML = `<div class="empty">⚠ 渲染出错:${e.message}</div>`; }
  },
  async bindLogin() {
    const form = $('#login-form');
    if (!form) return;
    form.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const btn = form.querySelector('button[type="submit"]');
      if (btn) { btn.disabled = true; btn.textContent = '登录中...'; }
      const r = await DB.login(fd.get('username'), fd.get('password'));
      if (btn) { btn.disabled = false; btn.textContent = '登 录'; }
      if (r.ok) {
        this.view = 'dashboard';
        this.render();
      } else {
        UI.toast(r.error || '登录失败', 'error');
      }
    };
  },
  shell() {
    const u = Auth.user;
    const co = Auth.company;
    const coList = Auth.accessibleCompanyIds().map(cid => DB.company(cid));
    const nav = NAV.filter(n => Auth.can(n.action)).map(n => {

      return `<button class="nav-item ${active ? 'active' : ''}" data-action="nav" data-view="${n.view}">

    const roleLabel = { boss: '老板', accountant: '会计', employee: '员工' }[u.role];
    return `
      <div class="app-shell">
        ${this.sidebarOpen ? '<div class="sidebar-mask show" onclick="App.toggleSidebar()"></div>' : ''}
        <aside class="sidebar ${this.sidebarOpen ? 'open' : ''}">

          </div>
          <nav class="sidebar-nav">${nav}</nav>
          <div class="sidebar-foot">v1.1 · 数据本地存储+自动快照<br>© ${new Date().getFullYear()} 熠徽建筑</div>
        </aside>
        <div class="main">
          <header class="topbar">
            <button class="icon-btn menu-toggle" data-action="toggleSidebar">☰</button>
            ${coList.length > 1 ? `
            <div class="company-switcher" data-action="company-switcher">

            </div>` : `<div class="topbar-title">${co.short}</div>`}
            <div class="topbar-spacer"></div>
            <div class="topbar-actions">
              <button class="icon-btn sync-btn" data-action="sync-now" title="${DB.token && DB.token.startsWith('local-') ? '本地存储模式·数据保存在本机' : (DB.online ? '已联网·点击立即同步' : '离线·点击重试同步')}">
                <span class="sync-dot ${DB.token && DB.token.startsWith('local-') ? 'local' : (DB.online ? 'online' : 'offline')}"></span>
                <span class="sync-label">${DB.token && DB.token.startsWith('local-') ? '本地存储' : (DB.online ? '已同步' : '离线')}</span>
              </button>
              <button class="icon-btn" data-action="nav" data-view="dashboard" title="刷新">🔄</button>
              <div class="user-chip" data-action="logout" title="退出登录">

              </div>
            </div>
          </header>
          <main class="content" id="view-content"></main>
        </div>
      </div>`;

  companySwitcherMenu() {
    const list = Auth.accessibleCompanyIds().map(cid => DB.company(cid));
    const cur = Auth.companyId;
    UI.modal({
      title: '切换公司',
      body: list.map(c => `
        <div class="card" style="margin-bottom:8px;cursor:pointer;padding:14px;${c.id === cur ? 'border-color:var(--c-primary);background:var(--c-primary-l);' : ''}"
          onclick="Auth.switchCompany('${c.id}');document.getElementById('modal-root').innerHTML='';">
          <div style="font-weight:600;">${c.name}</div>
          <div class="text-sm text-muted">${c.address || ''}</div>

};

/* ----- 工作台 ----- */
VIEWS.dashboard = function () {
  const cid = Auth.companyId;
  const txns = DB.txns(t => t.companyId === cid);
  const today = fmt.today();
  const mStart = dates.monthStart(), mEnd = dates.monthEnd();
  const tInc = txns.filter(t => t.type === 'income' && t.date === today).reduce((s, t) => s + t.amount, 0);
  const tExp = txns.filter(t => t.type === 'expense' && t.date === today).reduce((s, t) => s + t.amount, 0);
  const mInc = txns.filter(t => t.type === 'income' && dates.inRange(t.date, mStart, mEnd)).reduce((s, t) => s + t.amount, 0);
  const mExp = txns.filter(t => t.type === 'expense' && dates.inRange(t.date, mStart, mEnd)).reduce((s, t) => s + t.amount, 0);
  const tCount = txns.filter(t => t.date === today).length;
  const arList = DB.data.receivables.filter(r => r.companyId === cid && r.status !== 'paid');
  const dueAr = arList.filter(r => r.dueDate < today);
  const empActive = DB.employees(cid).filter(e => e.status === 'active');
  const mAtt = DB.data.attendance.filter(a => {
    const e = DB.employee(a.employeeId); return e && e.companyId === cid && dates.inRange(a.date, mStart, mEnd);
  });
  const unpaidEmps = empActive.filter(e => {
    const days = mAtt.filter(a => a.employeeId === e.id).reduce((s, a) => s + (a.status === 'full' ? 1 : a.status === 'half' ? 0.5 : 0), 0);
    const paid = DB.data.wagePayments.filter(w => w.employeeId === e.id && w.periodStart === mStart).reduce((s, w) => s + w.amount, 0);
    return days * e.dailyWage > paid;
  });
  const recent = [...txns].sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt)).slice(0, 6);
  const cats = DB.categories(cid, 'expense');
  const catStats = cats.map(c => ({ ...c, amt: txns.filter(t => t.categoryId === c.id).reduce((s, t) => s + t.amount, 0) })).filter(c => c.amt > 0).sort((a, b) => b.amt - a.amt).slice(0, 5);
  const maxCat = catStats[0]?.amt || 1;

  return `
    <div class="content-padded">
      <div class="page-head">
        <div><div class="page-title">工作台</div><div class="page-sub">${fmt.month(today)} · ${new Date().toLocaleDateString('zh-CN', { weekday: 'long' })}</div></div>
        <div class="flex gap-8">
          ${Auth.can('bookkeeping') ? `<button class="btn btn-accent" data-action="tx-new">+ 记一笔</button>` : ''}
        </div>
      </div>
      <div class="grid grid-4 mb-16">
        <div class="card stat-card"><div class="stat-icon" style="background:var(--c-green-l);color:var(--c-green);">↓</div>
          <div class="stat-meta"><div class="stat-label">今日收入</div><div class="stat-value">${fmt.money(tInc)}</div><div class="stat-foot">今日 ${tCount} 笔流水</div></div></div>
        <div class="card stat-card"><div class="stat-icon" style="background:var(--c-red-l);color:var(--c-red);">↑</div>
          <div class="stat-meta"><div class="stat-label">今日支出</div><div class="stat-value">${fmt.money(tExp)}</div><div class="stat-foot">今日净额 ${fmt.money(tInc - tExp)}</div></div></div>
        <div class="card stat-card"><div class="stat-icon" style="background:var(--c-primary-l);color:var(--c-primary);">📅</div>
          <div class="stat-meta"><div class="stat-label">本月收入</div><div class="stat-value">${fmt.money(mInc)}</div><div class="stat-foot">本月支出 ${fmt.money(mExp)}</div></div></div>
        <div class="card stat-card"><div class="stat-icon" style="background:${(mInc - mExp) >= 0 ? 'var(--c-green-l)' : 'var(--c-red-l)'};color:${(mInc - mExp) >= 0 ? 'var(--c-green)' : 'var(--c-red)'};">📊</div>
          <div class="stat-meta"><div class="stat-label">本月结余</div><div class="stat-value">${fmt.money(mInc - mExp)}</div><div class="stat-foot">利润率 ${mInc ? ((mInc - mExp) / mInc * 100).toFixed(1) : 0}%</div></div></div>
      </div>

      <div class="grid grid-3 mb-16">
        <div class="card"><div class="card-head"><div class="card-title">⚠ 待办提醒</div></div><div class="card-body">
          ${dueAr.length === 0 && unpaidEmps.length === 0 ? UI.empty('✓', '暂无待办') : ''}
          ${dueAr.length ? `<div style="margin-bottom:10px;padding:10px;background:var(--c-red-l);border-radius:8px;">
            <div style="font-weight:600;color:var(--c-red);">应收应付逾期 ${dueAr.length} 项</div>
            <div class="text-sm text-muted">合计 ${fmt.money(dueAr.reduce((s, r) => s + r.amount, 0))}</div>
            <button class="btn btn-sm btn-ghost mt-8" data-action="nav" data-view="receivables">查看 →</button>
          </div>` : ''}
          ${unpaidEmps.length ? `<div style="padding:10px;background:var(--c-yellow-l);border-radius:8px;">
            <div style="font-weight:600;color:var(--c-yellow);">${unpaidEmps.length} 名员工本月有未发工资</div>
            <button class="btn btn-sm btn-ghost mt-8" data-action="nav" data-view="wages">去发放 →</button>
          </div>` : ''}
        </div></div>

        <div class="card" style="grid-column:span 2;"><div class="card-head"><div class="card-title">近期流水</div>
          <button class="btn btn-sm btn-ghost" data-action="nav" data-view="bookkeeping">全部 →</button></div>
          <div class="table-wrap">
            <table class="data">
              ${recent.length === 0 ? `<tr><td>${UI.empty('📭', '暂无流水,点右上角记一笔')}</td></tr>` :
                `<tr><th>日期</th><th>项目</th><th>分类</th><th>备注</th><th class="text-right">金额</th></tr>` +
                recent.map(t => {
                  const p = DB.project(t.projectId); const c = DB.category(t.companyId, t.type, t.categoryId) || { name: '其他' };
                  return `<tr>
                    <td>${fmt.date(t.date)}</td>
                    <td>${p ? p.name : '—'}</td>
                    <td><span class="tag tag-gray">${c.icon || ''} ${c.name}</span></td>
                    <td class="cell-note">${t.note || '—'}</td>
                    <td class="text-right cell-amount ${t.type}">${t.type === 'income' ? '+' : '-'}${fmt.money(t.amount, false)}</td>
                  </tr>`;
                }).join('')}
            </table>
          </div>
        </div>
      </div>

      <div class="grid grid-2">
        <div class="card"><div class="card-head"><div class="card-title">支出分类排行(累计)</div></div>
          <div class="card-body">
            ${catStats.length === 0 ? UI.empty('📊', '暂无支出数据') : catStats.map(c => `
              <div style="margin-bottom:12px;">
                <div class="flex justify-between text-sm mb-8"><span>${c.icon} ${c.name}</span><b>${fmt.money(c.amt)}</b></div>
                <div class="progress"><div class="progress-bar" style="width:${(c.amt / maxCat * 100).toFixed(0)}%;background:${c.color};"></div></div>
              </div>`).join('')}
          </div>
        </div>
        <div class="card"><div class="card-head"><div class="card-title">项目盈亏速览</div>
          <button class="btn btn-sm btn-ghost" data-action="nav" data-view="projects">管理 →</button></div>
          <div class="card-body">
            ${DB.projects(cid).length === 0 ? UI.empty('🏗', '暂无项目') : DB.projects(cid).map(p => {
              const inc = txns.filter(t => t.projectId === p.id && t.type === 'income').reduce((s, t) => s + t.amount, 0);
              const exp = txns.filter(t => t.projectId === p.id && t.type === 'expense').reduce((s, t) => s + t.amount, 0);
              const profit = inc - exp;
              return `<div style="margin-bottom:12px;padding:10px;border:1px solid var(--c-border);border-radius:8px;cursor:pointer;" data-action="proj-open" data-id="${p.id}">
                <div class="flex justify-between"><b style="font-size:13px;">${p.name}</b><span class="tag ${p.status === 'active' ? 'tag-green' : 'tag-gray'}">${p.status === 'active' ? '进行中' : '已完工'}</span></div>
                <div class="flex justify-between text-sm text-muted mt-8"><span>收入 ${fmt.money(inc, false)}</span><span>支出 ${fmt.money(exp, false)}</span><b style="color:${profit >= 0 ? 'var(--c-green)' : 'var(--c-red)'};">${profit >= 0 ? '盈' : '亏'} ${fmt.money(Math.abs(profit), false)}</b></div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>

      <div class="grid grid-2 mt-16">
        <div class="card"><div class="card-head">
          <div class="card-title">🎯 预算预警</div>
          <button class="btn btn-sm btn-ghost" data-action="nav" data-view="projects">管理 →</button>
        </div><div class="card-body">
          ${(function() {
            const projs = DB.projects(cid).filter(p => p.budget > 0);
            if (projs.length === 0) return UI.empty('🎯', '尚无项目设预算');
            const list = projs.map(p => {
              const exp = txns.filter(t => t.projectId === p.id && t.type === 'expense').reduce((s, t) => s + t.amount, 0)
                + DB.data.wagePayments.filter(w => { const e = DB.employee(w.employeeId); return e && e.companyId === cid && w.projectId === p.id; }).reduce((s, w) => s + w.amount, 0);
              const rate = p.budget > 0 ? (exp / p.budget * 100) : 0;
              const threshold = p.alertThreshold || 80;
              const over = exp > p.budget;
              const near = !over && rate >= threshold;
              return { p, exp, rate, over, near };
            }).filter(x => x.over || x.near).sort((a, b) => b.rate - a.rate);
            if (list.length === 0) return `<div class="text-sm text-muted">✓ 所有项目预算可控</div>`;
            return list.slice(0, 5).map(x => `
              <div style="padding:6px 0;border-bottom:1px solid var(--c-border);" data-action="proj-open" data-id="${x.p.id}">
                <div class="flex justify-between text-sm">
                  <b style="color:${x.over ? 'var(--c-red)' : 'var(--c-yellow)'};">${x.over ? '🚨' : '⚠'} ${x.p.name}</b>
                  <span style="color:${x.over ? 'var(--c-red)' : 'var(--c-yellow)'};">${x.rate.toFixed(0)}%</span>
                </div>
                <div class="text-sm text-muted">预算 ${fmt.money(x.p.budget, false)} · 已用 ${fmt.money(x.exp, false)}</div>
              </div>
            `).join('');
          })()}
        </div></div>

        <div class="card"><div class="card-head">
          <div class="card-title">📑 合同提醒</div>
          <button class="btn btn-sm btn-ghost" data-action="nav" data-view="contracts">管理 →</button>
        </div><div class="card-body">
          ${(function() {
            const cs = DB.contracts(cid);
            const today = fmt.today();
            const due = cs.filter(c => c.dueDate && c.dueDate < today && c.status === 'active');
            const active = cs.filter(c => c.status === 'active');
            if (cs.length === 0) return UI.empty('📑', '暂无合同');
            return `
              <div class="text-sm flex justify-between mb-8"><span class="text-muted">履行中</span><b>${active.length}</b></div>
              <div class="text-sm flex justify-between mb-8"><span class="text-muted">到期未完成</span><b style="color:${due.length ? 'var(--c-red)' : 'inherit'};">${due.length}</b></div>
              ${due.slice(0, 3).map(c => `<div class="text-sm" style="padding:4px 0;color:var(--c-red);">• ${c.name} · ${fmt.short(c.dueDate)}</div>`).join('')}
            `;
          })()}
        </div></div>

        <div class="card"><div class="card-head">
          <div class="card-title">📋 今日工地日报</div>
          <button class="btn btn-sm btn-ghost" data-action="nav" data-view="dailyLogs">管理 →</button>
        </div><div class="card-body">
          ${(function() {
            const today = fmt.today();
            const todayLogs = DB.dailyLogs(cid).filter(d => d.date === today);
            if (todayLogs.length === 0) return UI.empty('📋', '今日还没写日报') + `<button class="btn btn-sm btn-primary mt-8" data-action="dl-new">写今日日报</button>`;
            return todayLogs.map(d => {
              const p = DB.project(d.projectId);
              return `<div class="text-sm" style="padding:4px 0;">• ${p ? p.name : '未关联'} · ${d.weather} · ${d.workers || '—'}</div>`;
            }).join('');
          })()}
        </div></div>
      </div>

      <div class="grid grid-2 mt-16">
        <div class="card"><div class="card-head">
          <div class="card-title">☁ 同步状态</div>
          <button class="btn btn-sm btn-primary" data-action="sync-now">立即同步</button>
        </div><div class="card-body">
          <div class="flex justify-between mb-8">
            <span class="text-muted">当前状态</span>
            <b style="color:${DB.online ? 'var(--c-green)' : 'var(--c-yellow)'};">
              <span class="sync-dot ${DB.online ? 'online' : 'offline'}" style="display:inline-block;"></span>
              ${DB.online ? '已联网·数据云端同步' : '离线·数据存本地'}
            </b>
          </div>
          <div class="flex justify-between mb-8">
            <span class="text-muted">上次同步</span>
            <b>${DB.lastSyncAt ? fmt.datetime(DB.lastSyncAt) : '—'}</b>
          </div>
          <div class="flex justify-between">
            <span class="text-muted">待同步</span>
            <b>${DB._dirty ? '有未同步的修改' : '全部已同步'}</b>
          </div>
        </div></div>

        <div class="card"><div class="card-head"><div class="card-title">同步日志</div></div>
          <div class="card-body" style="max-height:200px;overflow:auto;">
            ${DB.syncLog.length === 0 ? UI.empty('📋', '暂无同步记录') : DB.syncLog.map(l => `
              <div class="flex justify-between text-sm" style="padding:4px 0;border-bottom:1px solid var(--c-border-l);">
                <span><span style="color:${l.ok ? 'var(--c-green)' : 'var(--c-red)'};">${l.ok ? '✓' : '✗'}</span> ${l.msg}</span>
                <span class="text-muted">${fmt.time(l.t)}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>`;
};

/* ========== 日常记账 ========== */
const Bookkeeping = {
  filter: { type: '', categoryId: '', projectId: '', dateStart: '', dateEnd: '', q: '' },
  form(id) {
    const cid = Auth.companyId;
    const t = id ? DB.data.transactions.find(x => x.id === id) : { type: 'expense', date: fmt.today() };
    if (!t) return;
    const cats = (type) => DB.categories(cid, type);
    const projs = DB.projects(cid);
    UI.formModal({
      title: id ? '编辑流水' : '记一笔',
      data: t,
      submitText: id ? '保存修改' : '记一笔',
      draftKey: id ? null : 'tx_new',
      fields: [
        { type: 'row', fields: [
          { key: 'type', label: '类型', type: 'select', required: true, options: [{ value: 'expense', label: '💸 支出' }, { value: 'income', label: '💰 收入' }] },
          { key: 'amount', label: '金额(元)', type: 'number', required: true, step: '0.01', placeholder: '0.00' },
        ]},
        { type: 'row', fields: [
          { key: 'categoryId', label: '分类', type: 'select', required: true, options: [{ value: '', label: '请选择' }].concat(cats(t.type).map(c => ({ value: c.id, label: `${c.icon} ${c.name}` }))) },
          { key: 'projectId', label: '所属项目', type: 'select', options: [{ value: '', label: '不关联项目' }].concat(projs.map(p => ({ value: p.id, label: p.name }))) },
        ]},
        { key: 'date', label: '日期', type: 'date', required: true, default: fmt.today() },
        { key: 'note', label: '备注', type: 'textarea', rows: 2, placeholder: '可填写对方单位、用途等' },
      ],
      onSubmit: (d) => {
        if (!d.amount || d.amount <= 0) { UI.toast('金额必须大于0', 'error'); return; }
        if (!d.categoryId) { UI.toast('请选择分类', 'warn'); return; }
        const obj = Object.assign({}, t, d, { companyId: cid, createdBy: Auth.user.id, createdAt: t.createdAt || dates.now() });
        if (!obj.id) obj.id = uid('tx');
        obj.bills = t.bills || [];
        if (id) DB.update(obj, 'transactions'); else DB.add(obj, 'transactions');
        UI.toast(id ? '已修改' : '已记账', 'success');
        App.render();
      },
    });
    const typeSel = $('#modal-root [name="type"]');
    const catSel = $('#modal-root [name="categoryId"]');
    if (typeSel) typeSel.onchange = () => {
      catSel.innerHTML = '<option value="">请选择</option>' + cats(typeSel.value).map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
    };
  },
  del(id) {
    const t = DB.data.transactions.find(x => x.id === id);
    if (!t) return;
    UI.confirm(`确定删除这笔流水吗?<br><b>${t.type === 'income' ? '收入' : '支出'} ${fmt.money(t.amount)}</b><br>${t.note || ''}`, () => {
      DB.remove(id, 'transactions');
      DB.data.bills.forEach(b => { if (b.transactionId === id) b.transactionId = null; });
      DB.save();
      UI.toast('已删除', 'success');
      App.render();
    });
  },
  viewBills(id) {
    const t = DB.data.transactions.find(x => x.id === id);
    if (!t) return;
    const bills = DB.data.bills.filter(b => b.transactionId === id);
    UI.modal({
      title: '关联票据',
      body: bills.length === 0 ? `<div class="empty"><div class="empty-icon">🖼</div>暂无票据<br><button class="btn btn-primary mt-16" data-action="bill-new-from-tx" data-id="${id}">+ 上传票据</button></div>` :
        `<div class="bill-grid">${bills.map(b => `<div class="bill-tile" onclick="UI.picModal('${b.image || placeholderBill()}')"><img class="bill-thumb" src="${b.image || placeholderBill()}"><div class="bill-meta"><div class="t">${b.name}</div><div class="d">${fmt.date(b.uploadDate)}</div></div></div>`).join('')}</div>
         <div class="mt-16"><button class="btn btn-primary" data-action="bill-new-from-tx" data-id="${id}">+ 追加票据</button></div>`,
    });
  },
  exportCsv() {
    const cid = Auth.companyId;
    let list = this.applyFilter(DB.txns(t => t.companyId === cid));
    list.sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
    const headers = ['日期', '类型', '分类', '项目', '金额', '备注', '录入人', '录入时间'];
    const rows = list.map(t => {
      const c = DB.category(t.companyId, t.type, t.categoryId) || { name: '' };
      const p = DB.project(t.projectId);
      const u = DB.user(t.createdBy);
      return [t.date, t.type === 'income' ? '收入' : '支出', `${c.icon || ''} ${c.name}`.trim(), p ? p.name : '', t.amount, t.note || '', u ? u.name : '', new Date(t.createdAt).toLocaleString('zh-CN')];
    });
    Export.csv(`熠徽流水_${fmt.today()}.csv`, headers, rows);
  },
  applyFilter(list) {
    const f = this.filter;
    return list.filter(t => {
      if (f.type && t.type !== f.type) return false;
      if (f.categoryId && t.categoryId !== f.categoryId) return false;
      if (f.projectId && t.projectId !== f.projectId) return false;
      if (!dates.inRange(t.date, f.dateStart, f.dateEnd)) return false;
      if (f.q) {
        const c = DB.category(t.companyId, t.type, t.categoryId) || {};
        const p = DB.project(t.projectId);
        const hay = `${t.note || ''} ${c.name || ''} ${p ? p.name : ''}`;
        if (!hay.toLowerCase().includes(f.q.toLowerCase())) return false;
      }
      return true;
    });
  },
};

                <td class="cell-note" title="${t.note || ''}">${t.note || '—'}</td>

              </tr>`;
            }).join('')}
          </table>`}
        </div>
      </div>
    </div>`;
};

/* ========== 项目分账 ========== */
// 充电桩安装施工工序(7 步)
const STAGES = ['现场勘测', '设备采购', '基础施工', '桩体安装', '电缆敷设+接电', '检测调试', '验收交付'];
const STAGE_ICONS = ['📐', '🛒', '🏗', '🔌', '⚡', '🔍', '✅'];
const STAGE_STATUS = { pending: ['待开始', 'tag-gray', '⏳'], doing: ['进行中', 'tag-yellow', '🔨'], done: ['已完成', 'tag-green', '✓'] };

const Projects = {
  form(id) {
    const cid = Auth.companyId;
    const p = id ? DB.project(id) : { status: 'active', startDate: fmt.today() };
    if (!p) return;
    UI.formModal({
      title: id ? '编辑项目' : '新建项目',
      data: p,
      fields: [
        { key: 'name', label: '项目/工地名称', required: true, placeholder: '如:浦东充电站安装工程' },
        { type: 'row', fields: [
          { key: 'client', label: '客户/甲方' },
          { key: 'contractAmount', label: '合同金额', type: 'number', step: '0.01' },
        ]},
        { key: 'address', label: '工地地址', placeholder: '详细地址' },
        { type: 'row', fields: [
          { key: 'startDate', label: '开工日期', type: 'date' },
          { key: 'endDate', label: '竣工日期', type: 'date' },
        ]},
        { type: 'row', fields: [
          { key: 'status', label: '状态', type: 'select', options: [{ value: 'active', label: '进行中' }, { value: 'done', label: '已完工' }, { value: 'paused', label: '停工' }] },
          { key: 'alertThreshold', label: '预算预警(%)', type: 'number', step: '1', placeholder: '80' },
        ]},
        { key: 'budget', label: '预算总额', type: 'number', step: '0.01', placeholder: '0.00(空则不预警)' },
        { type: 'html', html: '<div class="text-sm text-muted" style="padding:8px 0 0 0;">📋 预算明细(可选,填了则按分类预警)</div>' },
        { type: 'row', fields: [
          { key: 'b_device', label: '充电桩设备', type: 'number', step: '0.01', placeholder: '0' },
          { key: 'b_cable', label: '电缆线材', type: 'number', step: '0.01', placeholder: '0' },
        ]},
        { type: 'row', fields: [
          { key: 'b_panel', label: '配电箱/桥架', type: 'number', step: '0.01', placeholder: '0' },
          { key: 'b_grounding', label: '接地材料', type: 'number', step: '0.01', placeholder: '0' },
        ]},
        { type: 'row', fields: [
          { key: 'b_labor', label: '人工工资', type: 'number', step: '0.01', placeholder: '0' },
          { key: 'b_mach', label: '机械租赁', type: 'number', step: '0.01', placeholder: '0' },
        ]},
        { type: 'row', fields: [
          { key: 'b_sub', label: '分包款', type: 'number', step: '0.01', placeholder: '0' },
          { key: 'b_inspect', label: '检测验收', type: 'number', step: '0.01', placeholder: '0' },
        ]},
        { key: 'note', label: '备注', type: 'textarea', rows: 2, placeholder: '项目特殊要求、技术规格、工期节点等' },
      ],
      onSubmit: (d) => {
        const obj = Object.assign({}, p, d, { companyId: cid });
        obj.contractAmount = parseFloat(obj.contractAmount) || 0;
        obj.budget = parseFloat(obj.budget) || 0;
        obj.alertThreshold = parseInt(obj.alertThreshold) || 80;
        // 把 b_xxx 收拢成 budgetItems
        obj.budgetItems = {
          ce_device: parseFloat(obj.b_device) || 0,
          ce_cable: parseFloat(obj.b_cable) || 0,
          ce_panel: parseFloat(obj.b_panel) || 0,
          ce_grounding: parseFloat(obj.b_grounding) || 0,
          ce_labor: parseFloat(obj.b_labor) || 0,
          ce_mach: parseFloat(obj.b_mach) || 0,
          ce_sub: parseFloat(obj.b_sub) || 0,
          ce_inspect: parseFloat(obj.b_inspect) || 0,
        };
        delete obj.b_device; delete obj.b_cable; delete obj.b_panel;
        delete obj.b_grounding; delete obj.b_labor; delete obj.b_mach;
        delete obj.b_sub; delete obj.b_inspect;
        // 充电桩施工工序 7 步,默认待开始
        if (!obj.progress) obj.progress = STAGES.map((s, i) => ({ stage: s, status: 'pending', date: '', note: '' }));
        if (id) DB.update(obj, 'projects'); else DB.add(obj, 'projects');
        UI.toast(id ? '已修改' : '已创建', 'success');
        App.render();
      },
    });
  },
  setStage(projId, stageIdx, status) {
    const p = DB.project(projId);
    if (!p) return;
    if (!p.progress) p.progress = STAGES.map(s => ({ stage: s, status: 'pending', date: '', note: '' }));
    if (!p.progress[stageIdx]) return;
    p.progress[stageIdx].status = status;
    p.progress[stageIdx].date = (status === 'doing' || status === 'done') ? fmt.today() : '';
    DB.update(p, 'projects');
    UI.toast(`「${STAGES[stageIdx]}」已${status === 'done' ? '完成' : status === 'doing' ? '开始' : '重置'}`, 'success');
    App.render();
  },
  del(id) {
    const p = DB.project(id);
    if (!p) return;
    const hasTx = DB.data.transactions.some(t => t.projectId === id);
    UI.confirm(`确定删除项目「${p.name}」吗?${hasTx ? '<br><span style="color:var(--c-red);">该项目下有流水记录,删除后这些流水将变为"未关联项目"。</span>' : ''}`, () => {
      DB.data.transactions.forEach(t => { if (t.projectId === id) t.projectId = null; });
      DB.remove(id, 'projects');
      DB.save();
      UI.toast('已删除', 'success');
      App.render();
    });
  },
};

VIEWS.projects = function () {

  return `
    <div class="content-padded">
      <div class="page-head">
        <div><div class="page-title">项目/工地分账</div><div class="page-sub">按工地独立核算盈亏</div></div>
        ${Auth.can('projects') ? `<button class="btn btn-accent" data-action="proj-new">+ 新建项目</button>` : ''}
      </div>
      ${list.length === 0 ? `<div class="card">${UI.empty('🏗', '还没有项目,点击右上角新建')}</div>` :
      `<div class="grid grid-3">
        ${list.map(p => {
          const inc = txns.filter(t => t.projectId === p.id && t.type === 'income').reduce((s, t) => s + t.amount, 0);
          const exp = txns.filter(t => t.projectId === p.id && t.type === 'expense').reduce((s, t) => s + t.amount, 0);
          const profit = inc - exp;
          const prog = p.contractAmount ? Math.min(100, inc / p.contractAmount * 100) : 0;

          const ap = DB.data.receivables.filter(r => r.projectId === p.id && r.status !== 'paid' && r.type === 'payable').reduce((s, r) => s + r.amount - r.paidAmount, 0);
          return `<div class="card project-card" data-action="proj-open" data-id="${p.id}">
            <div class="flex justify-between"><div class="project-name">${p.name}</div><span class="tag ${p.status === 'active' ? 'tag-green' : p.status === 'done' ? 'tag-gray' : 'tag-yellow'}">${p.status === 'active' ? '进行中' : p.status === 'done' ? '已完工' : '停工'}</span></div>
            <div class="project-client">${p.client || ''} · ${p.address || ''}</div>

            <div class="project-stats">
              <div><div class="project-stat-label">收入</div><div class="project-stat-val" style="color:var(--c-green);">${fmt.money(inc, false)}</div></div>
              <div><div class="project-stat-label">支出</div><div class="project-stat-val" style="color:var(--c-red);">${fmt.money(exp, false)}</div></div>
              <div><div class="project-stat-label">盈亏</div><div class="project-stat-val" style="color:${profit >= 0 ? 'var(--c-green)' : 'var(--c-red)'};">${profit >= 0 ? '+' : ''}${fmt.money(profit, false)}</div></div>
            </div>
            ${(ar || ap) ? `<div class="text-sm text-muted mt-8" style="border-top:1px dashed var(--c-border);padding-top:8px;">应收 ${fmt.money(ar, false)} · 应付 ${fmt.money(ap, false)}</div>` : ''}
          </div>`;
        }).join('')}
      </div>`}
    </div>`;
};
