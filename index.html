        <div class="card stat-card"><div class="stat-icon" style="background:var(--c-green-l);color:var(--c-green);">↓</div><div class="stat-meta"><div class="stat-label">已收工程款</div><div class="stat-value">${fmt.money(inc)}</div></div></div>
        <div class="card stat-card"><div class="stat-icon" style="background:var(--c-red-l);color:var(--c-red);">↑</div><div class="stat-meta"><div class="stat-label">已发生支出</div><div class="stat-value">${fmt.money(exp + wageAmt)}</div><div class="stat-foot">直接支出 ${fmt.money(exp, false)} + 工资 ${fmt.money(wageAmt, false)}</div></div></div>
        <div class="card stat-card"><div class="stat-icon" style="background:${inc - exp - wageAmt >= 0 ? 'var(--c-green-l)' : 'var(--c-red-l)'};color:${inc - exp - wageAmt >= 0 ? 'var(--c-green)' : 'var(--c-red)'};">📊</div><div class="stat-meta"><div class="stat-label">项目盈亏</div><div class="stat-value">${fmt.money(inc - exp - wageAmt)}</div></div></div>
      </div>
      ${p.budget > 0 ? (() => {
        const totalExp = exp + wageAmt;
        const execRate = p.budget > 0 ? (totalExp / p.budget * 100) : 0;
        const threshold = p.alertThreshold || 80;
        const overBudget = totalExp > p.budget;
        const nearOver = !overBudget && execRate >= threshold;
        const statusColor = overBudget ? 'var(--c-red)' : (nearOver ? 'var(--c-yellow)' : 'var(--c-green)');
        const statusBg = overBudget ? 'var(--c-red-l)' : (nearOver ? 'var(--c-yellow-l)' : 'var(--c-green-l)');
        const statusText = overBudget ? '🚨 已超支' : (nearOver ? '⚠ 接近预警' : '✓ 预算可控');
        // 分类预算对比
        const cats = DB.categories(cid, 'expense');
        const budgetItems = p.budgetItems || {};
        const catRows = cats.map(c => {
          const budget = budgetItems[c.id] || 0;
          if (budget <= 0) return null;
          const actual = txns.filter(t => t.type === 'expense' && t.categoryId === c.id).reduce((s, t) => s + t.amount, 0);
          const rate = budget > 0 ? (actual / budget * 100) : 0;
          const over = actual > budget;
          const near = !over && rate >= threshold;
          return { c, budget, actual, rate, over, near };
        }).filter(x => x);
        return `
        <div class="card mb-16" style="border-left:4px solid ${statusColor};">
          <div class="card-head">
            <div class="card-title">🎯 预算预警</div>
            <div><span class="tag" style="background:${statusBg};color:${statusColor};">${statusText}</span></div>
          </div>
          <div class="card-body">
            <div class="flex justify-between mb-8">
              <span class="text-muted">总预算 ${fmt.money(p.budget, false)} · 预警阈值 ${threshold}%</span>
              <b style="color:${statusColor};">已用 ${fmt.money(totalExp, false)} (${execRate.toFixed(1)}%)</b>
            </div>
            <div style="background:var(--c-bg);border-radius:6px;height:24px;overflow:hidden;margin-bottom:12px;">
              <div style="width:${Math.min(100, execRate).toFixed(1)}%;height:100%;background:${statusColor};transition:width .3s;"></div>
            </div>
            ${catRows.length === 0 ? '' : `
            <div class="table-wrap"><table class="data">
              <tr><th>分类</th><th class="text-right">预算</th><th class="text-right">实际</th><th class="text-right">执行率</th><th>状态</th></tr>
              ${catRows.map(r => `
                <tr${r.over ? ' style="background:var(--c-red-l);"' : r.near ? ' style="background:var(--c-yellow-l);"' : ''}>
                  <td>${r.c.icon} ${r.c.name}</td>
                  <td class="text-right">${fmt.money(r.budget, false)}</td>
                  <td class="text-right">${fmt.money(r.actual, false)}</td>
                  <td class="text-right" style="color:${r.over ? 'var(--c-red)' : r.near ? 'var(--c-yellow)' : 'inherit'};font-weight:600;">${r.rate.toFixed(1)}%</td>
                  <td>${r.over ? '<span class="tag tag-red">超支</span>' : r.near ? '<span class="tag tag-yellow">接近</span>' : '<span class="tag tag-green">可控</span>'}</td>
                </tr>
              `).join('')}
            </table></div>`}
            ${overBudget ? `<div class="text-sm" style="color:var(--c-red);padding:8px 0 0 0;">⚠ 已超支 ${fmt.money(totalExp - p.budget, false)} 元,建议核查支出明细。</div>` : ''}
          </div>
        </div>`;
      })() : ''}
      ${(() => {
        // 充电桩施工 7 步进度
        if (!p.progress) p.progress = STAGES.map(s => ({ stage: s, status: 'pending', date: '', note: '' }));
        const doneCount = p.progress.filter(s => s.status === 'done').length;
        const totalCount = p.progress.length;
        const progressPct = totalCount > 0 ? (doneCount / totalCount * 100) : 0;
        return `
        <div class="card mb-16">
          <div class="card-head">
            <div class="card-title">📋 充电桩施工进度(${doneCount}/${totalCount})</div>
            <div class="text-sm text-muted">${progressPct.toFixed(0)}% 完成</div>
          </div>
          <div class="card-body">
            <div style="background:var(--c-bg);border-radius:6px;height:20px;overflow:hidden;margin-bottom:16px;">
              <div style="width:${progressPct.toFixed(1)}%;height:100%;background:var(--c-green);transition:width .3s;"></div>
            </div>
            <div class="grid grid-steps">
              ${p.progress.map((s, i) => {
                const st = STAGE_STATUS[s.status] || STAGE_STATUS.pending;
                const icon = STAGE_ICONS[i] || '📌';
                return `<div class="stage-card ${s.status}">
                  <div class="stage-icon">${s.status === 'done' ? '✓' : s.status === 'doing' ? '🔨' : icon}</div>
                  <div class="stage-name">${STAGES[i] || s.stage}</div>
                  <div class="stage-status"><span class="tag ${st[1]}">${st[0]}</span></div>
                  ${s.date ? `<div class="stage-date text-sm text-muted">${fmt.short(s.date)}</div>` : ''}
                  ${Auth.can('projects') ? `<div class="stage-actions">
                    <button class="btn btn-sm ${s.status === 'doing' ? 'btn-primary' : 'btn-ghost'}" data-action="proj-stage" data-id="${p.id}" data-stage="${i}" data-status="doing">开始</button>
                    <button class="btn btn-sm ${s.status === 'done' ? 'btn-accent' : 'btn-ghost'}" data-action="proj-stage" data-id="${p.id}" data-stage="${i}" data-status="done">完成</button>
                  </div>` : ''}
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>`;
      })()}
      <div class="card mb-16"><div class="card-head"><div class="card-title">项目流水(${txns.length})</div><button class="btn btn-sm btn-accent" data-action="tx-new">+ 记一笔</button></div>
        <div class="table-wrap">
          ${txns.length === 0 ? UI.empty('📭', '该项目暂无流水') : `
          <table class="data">
            <tr><th>日期</th><th>类型</th><th>分类</th><th>备注</th><th class="text-right">金额</th></tr>
            ${txns.sort((a, b) => b.date.localeCompare(a.date)).map(t => {
              const c = DB.category(t.companyId, t.type, t.categoryId) || {};
              return `<tr><td>${fmt.dateFull(t.date)}</td><td>${t.type === 'income' ? '<span class="tag tag-green">收入</span>' : '<span class="tag tag-red">支出</span>'}</td><td><span class="tag tag-gray">${c.icon} ${c.name}</span></td><td>${t.note || '—'}</td><td class="text-right cell-amount ${t.type}">${t.type === 'income' ? '+' : '-'}${fmt.money(t.amount, false)}</td></tr>`;
            }).join('')}
          </table>`}
        </div>
      </div>
      <div class="grid grid-2">
        <div class="card"><div class="card-head"><div class="card-title">应收应付(${ar.length})</div></div>
          <div class="table-wrap">${ar.length === 0 ? UI.empty('💳', '暂无') : `
            <table class="data"><tr><th>类型</th><th>对方</th><th>金额</th><th>到期</th><th>状态</th></tr>
            ${ar.map(r => `<tr><td>${r.type === 'receivable' ? '<span class="tag tag-green">应收</span>' : '<span class="tag tag-red">应付</span>'}</td><td>${r.counterparty}</td><td class="cell-amount">${fmt.money(r.amount - r.paidAmount, false)}</td><td>${fmt.dateFull(r.dueDate)}</td><td>${r.status === 'paid' ? '<span class="tag tag-gray">已结</span>' : r.dueDate < fmt.today() ? '<span class="tag tag-red">逾期</span>' : '<span class="tag tag-yellow">未到期</span>'}</td></tr>`).join('')}
            </table>`}</div>
        </div>
        <div class="card"><div class="card-head"><div class="card-title">项目备注</div></div><div class="card-body">${p.note || '<span class="text-muted">无</span>'}</div></div>
      </div>
    </div>`;
};

/* ========== 应收应付 ========== */
const Receivables = {
  filter: { type: '', status: '', q: '' },
  dueCount() {
    const cid = Auth.companyId;
    if (!cid) return 0;
    const today = fmt.today();
    return DB.data.receivables.filter(r => r.companyId === cid && r.status !== 'paid' && r.dueDate < today).length;
  },
  form(id) {
    const cid = Auth.companyId;
    const r = id ? DB.data.receivables.find(x => x.id === id) : { type: 'receivable', dueDate: dates.addDays(fmt.today(), 30), paidAmount: 0, status: 'unpaid' };
    if (!r) return;
    const projs = DB.projects(cid);
    UI.formModal({
      title: id ? '编辑应收/应付' : '登记应收/应付',
      data: r,
      fields: [
        { type: 'row', fields: [
          { key: 'type', label: '类型', type: 'select', required: true, options: [{ value: 'receivable', label: '💰 应收(别人欠我)' }, { value: 'payable', label: '💸 应付(我欠别人)' }] },
          { key: 'amount', label: '总金额', type: 'number', required: true, step: '0.01' },
        ]},
        { key: 'counterparty', label: '对方单位/姓名', required: true, placeholder: '客户/供应商' },
        { type: 'row', fields: [
          { key: 'projectId', label: '关联项目', type: 'select', options: [{ value: '', label: '不关联' }].concat(projs.map(p => ({ value: p.id, label: p.name }))) },
          { key: 'dueDate', label: '到期日期', type: 'date', required: true },
        ]},
        { key: 'note', label: '说明', type: 'textarea', rows: 2 },
      ],
      onSubmit: (d) => {
        const obj = Object.assign({}, r, d, { companyId: cid, createdAt: r.createdAt || dates.now() });
        if (!obj.paidAmount) obj.paidAmount = 0;
        obj.status = obj.paidAmount >= obj.amount ? 'paid' : (obj.paidAmount > 0 ? 'partial' : 'unpaid');
        if (id) DB.update(obj, 'receivables'); else DB.add(obj, 'receivables');
        UI.toast(id ? '已修改' : '已登记', 'success');
        App.render();
      },
    });
  },
  del(id) {
    const r = DB.data.receivables.find(x => x.id === id);
    if (!r) return;
    UI.confirm(`确定删除该笔${r.type === 'receivable' ? '应收' : '应付'}记录吗?`, () => {
      DB.remove(id, 'receivables'); UI.toast('已删除', 'success'); App.render();
    });
  },
  pay(id) {
    const r = DB.data.receivables.find(x => x.id === id);
    if (!r) return;
    const remain = r.amount - r.paidAmount;
    UI.formModal({
      title: r.type === 'receivable' ? '登记收款' : '登记付款',
      data: { payAmount: remain, payDate: fmt.today(), method: '银行转账' },
      fields: [
        { type: 'row', fields: [
          { key: 'payAmount', label: '本次金额', type: 'number', required: true, step: '0.01', default: remain },
          { key: 'payDate', label: '日期', type: 'date', required: true, default: fmt.today() },
        ]},
        { key: 'method', label: '方式', type: 'select', options: ['银行转账', '现金', '微信/支付宝', '支票', '其他'].map(m => ({ value: m, label: m })), default: '银行转账' },
        { key: 'note', label: '备注', type: 'textarea', rows: 2 },
      ],
      onSubmit: (d) => {
        r.paidAmount = Math.min(r.amount, r.paidAmount + d.payAmount);
        if (r.paidAmount >= r.amount) { r.status = 'paid'; r.paidDate = d.payDate; }
        else { r.status = 'partial'; r.partialPayDate = d.payDate; }
        r.note = (r.note || '') + (r.note ? ' | ' : '') + `${d.payDate} ${d.method} ${fmt.money(d.payAmount)} ${d.note || ''}`;
        DB.update(r, 'receivables');
        const cid = r.companyId;
        const txType = r.type === 'receivable' ? 'income' : 'expense';
        const cat = DB.categories(cid, txType).find(c => c.name.includes(r.type === 'receivable' ? '回款' : '分包')) || DB.categories(cid, txType)[0];
        DB.add({ id: uid('t'), companyId: cid, type: txType, amount: d.payAmount, categoryId: cat ? cat.id : '', projectId: r.projectId || null, date: d.payDate, note: `${r.counterparty} ${r.type === 'receivable' ? '回款' : '付款'}${d.note ? ' - ' + d.note : ''}`, bills: [], createdBy: Auth.user.id, createdAt: dates.now() }, 'transactions');
        UI.toast(r.status === 'paid' ? '已结清' : '已部分核销', 'success');
        App.render();
      },
    });
  },
};

VIEWS.receivables = function () {
  const cid = Auth.companyId;
  const f = Receivables.filter;
  let list = DB.data.receivables.filter(r => r.companyId === cid);
  if (f.type) list = list.filter(r => r.type === f.type);
  if (f.status === 'overdue') list = list.filter(r => r.status !== 'paid' && r.dueDate < fmt.today());
  else if (f.status) list = list.filter(r => r.status === f.status);
  if (f.q) list = list.filter(r => (r.counterparty + r.note).toLowerCase().includes(f.q.toLowerCase()));
  const today = fmt.today();
  list.sort((a, b) => (a.status === 'paid' ? 1 : 0) - (b.status === 'paid' ? 1 : 0) || a.dueDate.localeCompare(b.dueDate));
  const recTotal = list.filter(r => r.type === 'receivable').reduce((s, r) => s + r.amount - r.paidAmount, 0);
  const payTotal = list.filter(r => r.type === 'payable').reduce((s, r) => s + r.amount - r.paidAmount, 0);
  return `
    <div class="content-padded">
      <div class="page-head">
        <div><div class="page-title">应收应付管理</div><div class="page-sub">客户欠款、供应商货款一目了然</div></div>
        ${Auth.can('receivables') ? `<button class="btn btn-accent" data-action="ar-new">+ 登记</button>` : ''}
      </div>
      <div class="grid grid-3 mb-16">
        <div class="card stat-card"><div class="stat-icon" style="background:var(--c-green-l);color:var(--c-green);">↓</div><div class="stat-meta"><div class="stat-label">应收余额</div><div class="stat-value">${fmt.money(recTotal)}</div></div></div>
        <div class="card stat-card"><div class="stat-icon" style="background:var(--c-red-l);color:var(--c-red);">↑</div><div class="stat-meta"><div class="stat-label">应付余额</div><div class="stat-value">${fmt.money(payTotal)}</div></div></div>
        <div class="card stat-card"><div class="stat-icon" style="background:var(--c-primary-l);color:var(--c-primary);">=</div><div class="stat-meta"><div class="stat-label">净应收</div><div class="stat-value">${fmt.money(recTotal - payTotal)}</div></div></div>
      </div>
      <div class="filter-bar">
        <select class="form-control" onchange="Receivables.filter.type=this.value;App.render()"><option value="">全部类型</option><option value="receivable" ${f.type === 'receivable' ? 'selected' : ''}>应收</option><option value="payable" ${f.type === 'payable' ? 'selected' : ''}>应付</option></select>
        <select class="form-control" onchange="Receivables.filter.status=this.value;App.render()"><option value="">全部状态</option><option value="unpaid" ${f.status === 'unpaid' ? 'selected' : ''}>未结清</option><option value="overdue" ${f.status === 'overdue' ? 'selected' : ''}>已逾期</option><option value="paid" ${f.status === 'paid' ? 'selected' : ''}>已结清</option></select>
        <div class="search-input"><input placeholder="搜索对方/说明" value="${f.q}" oninput="Receivables.filter.q=this.value;clearTimeout(window.__arT);window.__arT=setTimeout(()=>App.render(),300)"></div>
      </div>
      <div class="card"><div class="table-wrap">
        ${list.length === 0 ? UI.empty('💳', '暂无应收应付记录') : `
        <table class="data">
          <tr><th>类型</th><th>对方</th><th>关联项目</th><th class="text-right">总额</th><th class="text-right">已收/付</th><th class="text-right">余额</th><th>到期</th><th>状态</th>${Auth.can('receivables') ? '<th>操作</th>' : ''}</tr>
          ${list.map(r => {
            const p = DB.project(r.projectId);
            const overdue = r.status !== 'paid' && r.dueDate < today;
            return `<tr>
              <td>${r.type === 'receivable' ? '<span class="tag tag-green">应收</span>' : '<span class="tag tag-red">应付</span>'}</td>
              <td>${r.counterparty}</td>
              <td>${p ? `<span class="tag tag-blue">${p.name}</span>` : '—'}</td>
              <td class="text-right cell-amount">${fmt.money(r.amount, false)}</td>
              <td class="text-right cell-amount income">${fmt.money(r.paidAmount, false)}</td>
              <td class="text-right cell-amount ${r.amount - r.paidAmount > 0 ? 'expense' : ''}">${fmt.money(r.amount - r.paidAmount, false)}</td>
              <td>${fmt.dateFull(r.dueDate)}</td>
              <td>${r.status === 'paid' ? '<span class="tag tag-gray">已结清</span>' : overdue ? `<span class="tag tag-red">逾期${dates.diffDays(today, r.dueDate)}天</span>` : r.status === 'partial' ? '<span class="tag tag-yellow">部分</span>' : '<span class="tag tag-blue">未到期</span>'}</td>
              ${Auth.can('receivables') ? `<td>${r.status !== 'paid' ? `<button class="btn btn-sm btn-primary" data-action="ar-pay" data-id="${r.id}">收/付</button>` : ''} <button class="btn btn-sm btn-ghost" data-action="ar-edit" data-id="${r.id}">编辑</button> <button class="btn btn-sm btn-ghost" style="color:var(--c-red);" data-action="ar-del" data-id="${r.id}">删</button></td>` : ''}
            </tr>`;
          }).join('')}
        </table>`}
      </div></div>
    </div>`;
};

/* ========== 员工工资 ========== */

        { type: 'row', fields: [

          { key: 'position', label: '工种', placeholder: '木工/水电/泥瓦' },

          { key: 'dailyWage', label: '日工资(元)', type: 'number', required: true, step: '1' },
          { key: 'status', label: '状态', type: 'select', options: [{ value: 'active', label: '在职' }, { value: 'left', label: '已离职' }] },
        ]},
        { key: 'bankAccount', label: '银行卡号', placeholder: '工资发放用' },

      DB.data.attendance = DB.data.attendance.filter(a => a.employeeId !== id);
      DB.data.wagePayments = DB.data.wagePayments.filter(w => w.employeeId !== id);
      DB.remove(id, 'employees'); DB.save();
      UI.toast('已删除', 'success'); App.render();
    });
  },
  attForm(empId) {
    const e = DB.employee(empId);
    if (!e) return;
    UI.formModal({
      title: `${e.name} - 登记考勤`,
      data: { date: fmt.today(), status: 'full' },
      fields: [
        { type: 'row', fields: [
          { key: 'date', label: '日期', type: 'date', required: true, default: fmt.today() },
          { key: 'status', label: '状态', type: 'select', options: [{ value: 'full', label: '全天' }, { value: 'half', label: '半天' }, { value: 'absent', label: '缺勤' }, { value: 'overtime', label: '加班' }] },
        ]},
        { key: 'note', label: '备注', type: 'textarea', rows: 2 },
      ],
      onSubmit: (d) => {
        const exist = DB.data.attendance.find(a => a.employeeId === empId && a.date === d.date);

        else DB.add({ id: uid('a'), employeeId: empId, ...d }, 'attendance');
        UI.toast('考勤已记录', 'success'); App.render();

  attBatch() {

      title: '批量考勤登记',
      data: { date: fmt.today() },
      fields: [
        { key: 'date', label: '日期', type: 'date', required: true, default: fmt.today() },
        { key: 'status', label: '默认状态', type: 'select', options: [{ value: 'full', label: '全天' }, { value: 'half', label: '半天' }, { value: 'absent', label: '缺勤' }] },
        { key: 'note', label: '说明', type: 'textarea', rows: 2, placeholder: '将给所有在职员工批量登记' },
      ],
      onSubmit: (d) => {
        emps.forEach(e => {
          const exist = DB.data.attendance.find(a => a.employeeId === e.id && a.date === d.date);
          if (exist) { exist.status = d.status; exist.note = d.note; }
          else DB.data.attendance.push({ id: uid('a'), employeeId: e.id, date: d.date, status: d.status, note: d.note });
        });
        DB.save();
        UI.toast(`已为 ${emps.length} 名员工登记考勤`, 'success'); App.render();
      },
    });
  },
  payForm(empId) {
    const e = DB.employee(empId);
    if (!e) return;
    const m = Wages.attMonth;
    const mStart = m + '-01', mEnd = m + '-' + new Date(parseInt(m.slice(0, 4)), parseInt(m.slice(5, 7)), 0).getDate();
    const att = DB.data.attendance.filter(a => a.employeeId === empId && dates.inRange(a.date, mStart, mEnd));
    const days = att.reduce((s, a) => s + (a.status === 'full' ? 1 : a.status === 'half' ? 0.5 : a.status === 'overtime' ? 1.5 : 0), 0);
    const amount = Math.round(days * e.dailyWage);
    UI.formModal({
      title: `${e.name} - 工资发放`,
      data: { periodStart: mStart, periodEnd: mEnd, days, amount, payDate: fmt.today(), method: '银行转账' },
      fields: [
        { type: 'row', fields: [
          { key: 'periodStart', label: '工资起', type: 'date', required: true },
          { key: 'periodEnd', label: '工资止', type: 'date', required: true },
        ]},
        { type: 'row', fields: [
          { key: 'days', label: '出勤天数', type: 'number', step: '0.5', hint: `本月共出勤 ${days} 天` },
          { key: 'amount', label: '应发金额', type: 'number', step: '0.01', hint: `日薪 ${fmt.money(e.dailyWage, false)} × ${days} = ${fmt.money(amount, false)}` },
        ]},
        { type: 'row', fields: [
          { key: 'payDate', label: '发放日期', type: 'date', required: true, default: fmt.today() },
          { key: 'method', label: '发放方式', type: 'select', options: ['银行转账', '现金', '微信/支付宝'].map(m => ({ value: m, label: m })), default: '银行转账' },
        ]},
        { key: 'note', label: '备注', type: 'textarea', rows: 2 },
      ],
      onSubmit: (d) => {
        DB.add({ id: uid('w'), employeeId: empId, ...d, createdAt: dates.now() }, 'wagePayments');
        UI.toast('工资已登记发放', 'success'); App.render();
      },
    });
  },
  payAllForm() {
    const cid = Auth.companyId;
    const emps = DB.employees(cid).filter(e => e.status === 'active');
    const m = Wages.attMonth;
    const mStart = m + '-01', mEnd = m + '-' + new Date(parseInt(m.slice(0, 4)), parseInt(m.slice(5, 7)), 0).getDate();
    const list = emps.map(e => {
      const att = DB.data.attendance.filter(a => a.employeeId === e.id && dates.inRange(a.date, mStart, mEnd));
      const days = att.reduce((s, a) => s + (a.status === 'full' ? 1 : a.status === 'half' ? 0.5 : a.status === 'overtime' ? 1.5 : 0), 0);
      const paid = DB.data.wagePayments.filter(w => w.employeeId === e.id && w.periodStart === mStart).reduce((s, w) => s + w.amount, 0);
      return { e, days, amount: Math.round(days * e.dailyWage), paid };
    }).filter(x => x.days > 0 && x.paid < x.amount);
    if (list.length === 0) { UI.toast('本月无需发放的工资', 'warn'); return; }
    const total = list.reduce((s, x) => s + x.amount - x.paid, 0);
    UI.confirm(`将为 <b>${list.length}</b> 名员工登记本月工资发放,合计 <b>${fmt.money(total)}</b><br>发放日期:${fmt.today()} 方式:银行转账<br>可在发放后单独修改个别员工。`, () => {
      list.forEach(x => {
        DB.add({ id: uid('w'), employeeId: x.e.id, periodStart: mStart, periodEnd: mEnd, days: x.days, amount: x.amount - x.paid, payDate: fmt.today(), method: '银行转账', note: '批量发放', createdAt: dates.now() }, 'wagePayments');
      });
      UI.toast(`已登记 ${list.length} 笔工资`, 'success'); App.render();
    }, { title: '批量发放工资', okText: '确认发放' });
  },
  delWage(id) {
    UI.confirm('确定删除该笔工资发放记录吗?', () => {
      DB.remove(id, 'wagePayments'); UI.toast('已删除', 'success'); App.render();
    });
  },
  exportWageTable() {
    const cid = Auth.companyId;
    const m = Wages.attMonth;
    const emps = DB.employees(cid);
    const mStart = m + '-01', mEnd = m + '-' + new Date(parseInt(m.slice(0, 4)), parseInt(m.slice(5, 7)), 0).getDate();
    const rows = emps.map(e => {
      const att = DB.data.attendance.filter(a => a.employeeId === e.id && dates.inRange(a.date, mStart, mEnd));
      const days = att.reduce((s, a) => s + (a.status === 'full' ? 1 : a.status === 'half' ? 0.5 : a.status === 'overtime' ? 1.5 : 0), 0);
      const paid = DB.data.wagePayments.filter(w => w.employeeId === e.id && w.periodStart === mStart).reduce((s, w) => s + w.amount, 0);
      const amount = Math.round(days * e.dailyWage);
      return [e.name, e.position, e.dailyWage, days, amount, paid, amount - paid, e.bankAccount];
    });
    Export.csv(`熠徽工资表_${m}.csv`, ['姓名', '工种', '日薪', '出勤天数', '应发', '已发', '未发', '银行卡号'], rows);
  },
};

VIEWS.wages = function () {
  const cid = Auth.companyId;

  const attByEmp = (eid) => DB.data.attendance.filter(a => a.employeeId === eid && dates.inRange(a.date, mStart, mEnd));
  const wagesByEmp = (eid) => DB.data.wagePayments.filter(w => w.employeeId === eid);
  const totalDue = emps.reduce((s, e) => {
    const days = attByEmp(e.id).reduce((s, a) => s + (a.status === 'full' ? 1 : a.status === 'half' ? 0.5 : a.status === 'overtime' ? 1.5 : 0), 0);
    const paid = wagesByEmp(e.id).filter(w => w.periodStart === mStart).reduce((s, w) => s + w.amount, 0);

        ${Auth.can('wages') && totalDue > 0 ? `<button class="btn btn-primary btn-sm" data-action="wage-pay-all">一键发放</button>` : ''}
      </div>
      <div class="card"><div class="table-wrap">
        ${emps.length === 0 ? UI.empty('👷', '暂无员工') : `
        <table class="data">
          <tr><th>姓名</th><th>工种</th><th>日薪</th><th>本月出勤</th><th class="text-right">应发</th><th class="text-right">已发</th><th class="text-right">未发</th><th>状态</th>${Auth.can('wages') ? '<th>操作</th>' : ''}</tr>

            const due = Math.round(days * e.dailyWage);

        { key: 'projectId', label: '关联项目', type: 'select', options: [{ value: '', label: '不关联' }].concat(projs.map(p => ({ value: p.id, label: p.name }))) },
        { key: '_filePlaceholder', label: '图片(可拍照或选择文件)', hint: '支持手机拍照直接上传' },
      ],
      onSubmit: (d) => {
        const fileInput = $('#bill-file-input');
        const file = fileInput && fileInput.files[0];
        const save = (imageData) => {
          const obj = { id: uid('b'), companyId: cid, name: d.name, type: d.type, uploadDate: d.uploadDate, transactionId: d.transactionId, projectId: d.projectId, image: imageData || '', createdAt: dates.now() };
          DB.add(obj, 'bills');
          if (d.transactionId) { const t = DB.data.transactions.find(x => x.id === d.transactionId); if (t) { t.bills = t.bills || []; t.bills.push(obj.id); DB.save(); } }
          UI.toast('票据已上传', 'success'); App.render();
        };
        if (file) ImageUtil.compress(file).then(save);
        else save('');
      },
    });
    const body = $('#modal-root .modal-body');
    const form = body.querySelector('#modal-form');
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div style="margin-top:8px;border:2px dashed var(--c-border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;">
      <input type="file" id="bill-file-input" accept="image/*" capture="environment" style="display:none;">
      <div style="font-size:32px;opacity:.5;">📷</div>
      <div style="font-size:13px;color:var(--c-text-3);margin-top:6px;">点击拍照或选择图片</div>
      <img id="bill-preview" style="max-width:100%;max-height:200px;margin-top:10px;display:none;border-radius:8px;">
    </div>`;
    const dropZone = wrap.querySelector('div');
    const fileInput = wrap.querySelector('#bill-file-input');
    const preview = wrap.querySelector('#bill-preview');
    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = () => {
      const f = fileInput.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { preview.src = r.result; preview.style.display = 'block'; };
      r.readAsDataURL(f);
    };
    form.appendChild(wrap);
  },
  del(id) {
    const b = DB.data.bills.find(x => x.id === id);
    if (!b) return;
    UI.confirm(`确定删除票据「${b.name}」吗?`, () => {
      if (b.transactionId) { const t = DB.data.transactions.find(x => x.id === b.transactionId); if (t && t.bills) t.bills = t.bills.filter(x => x !== id); }
      DB.remove(id, 'bills'); UI.toast('已删除', 'success'); App.render();
    });
  },
  uploadToTx(txId) {
    this.form({ transactionId: txId });
  },
};

/* ========== 报表统计 ========== */
const Reports = {
  range: { start: dates.monthStart(), end: dates.monthEnd() },
};

VIEWS.reports = function () {
  const cid = Auth.companyId;
  const r = Reports.range;
  const txns = DB.txns(t => t.companyId === cid && dates.inRange(t.date, r.start, r.end));
  const inc = txns.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const exp = txns.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const expCats = DB.categories(cid, 'expense').map(c => ({ ...c, amt: txns.filter(t => t.type === 'expense' && t.categoryId === c.id).reduce((s, t) => s + t.amount, 0) })).filter(c => c.amt > 0).sort((a, b) => b.amt - a.amt);
  const incCats = DB.categories(cid, 'income').map(c => ({ ...c, amt: txns.filter(t => t.type === 'income' && t.categoryId === c.id).reduce((s, t) => s + t.amount, 0) })).filter(c => c.amt > 0).sort((a, b) => b.amt - a.amt);
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setMonth(d.getMonth() - i);
    const ms = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const me = ms + '-' + new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    const mt = DB.txns(t => t.companyId === cid && dates.inRange(t.date, ms + '-01', me));
    months.push({ label: `${d.getMonth() + 1}月`, inc: mt.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0), exp: mt.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0) });
  }
  const maxMonth = Math.max(...months.map(m => Math.max(m.inc, m.exp)), 1);
  const projStats = DB.projects(cid).map(p => {
    const ptx = DB.txns(t => t.projectId === p.id);
    const pInc = ptx.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const pExp = ptx.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    return { p, inc: pInc, exp: pExp, profit: pInc - pExp };
  }).sort((a, b) => b.profit - a.profit);

  const donut = (cats, total, label) => {
    if (cats.length === 0) return UI.empty('📊', '暂无数据');
    let offset = 0;
    const rad = 60, circ = 2 * Math.PI * rad;
    const segs = cats.map(cat => {
      const pct = total > 0 ? cat.amt / total : 0;
      const len = pct * circ;
      const seg = `<circle r="${rad}" cx="80" cy="80" fill="none" stroke="${cat.color}" stroke-width="28" stroke-dasharray="${len} ${circ - len}" stroke-dashoffset="${-offset}" transform="rotate(-90 80 80)"/>`;
      offset += len;
      return seg;
    }).join('');
    return `<div class="donut-wrap">
      <div class="donut"><svg width="160" height="160" viewBox="0 0 160 160" style="display:block;"><circle r="${rad}" cx="80" cy="80" fill="none" stroke="#f1f5f9" stroke-width="28"/>${segs}</svg>
      <div class="donut-center"><div>${label}</div><b>${fmt.money(total, false)}</b></div></div>
      <div class="legend">${cats.map(c => `<div class="legend-item"><div class="legend-dot" style="background:${c.color}"></div><span>${c.icon} ${c.name}</span><span class="legend-val">${fmt.money(c.amt, false)}</span></div>`).join('')}</div>
    </div>`;
  };

  return `
    <div class="content-padded">
      <div class="page-head">
        <div><div class="page-title">报表统计</div><div class="page-sub">数据可视化,经营状况一目了然</div></div>

const Contracts = {
  dueCount() {
    const cid = Auth.companyId;

    return DB.contracts(cid).filter(c => c.dueDate && c.dueDate < today && c.status !== 'completed').length;
  },
  form(id) {
    const cid = Auth.companyId;
    const c = id ? DB.contract(id) : { name: '', type: 'income', party: '', partyId: '', projectId: '', amount: '', signDate: fmt.today(), dueDate: '', status: 'active', content: '' };
    if (!c) return;
    const projs = DB.projects(cid);
    UI.formModal({
      title: id ? '编辑合同' : '新增合同',
      data: c,
      submitText: '保存',
      draftKey: id ? null : 'ct_new',
      fields: [
        { key: 'name', label: '合同名称', type: 'text', required: true, placeholder: '如:浦东别墅装修合同' },
        { type: 'row', fields: [
          { key: 'type', label: '类型', type: 'select', options: [{ value: 'income', label: '💰 收入合同(甲方付我)' }, { value: 'expense', label: '💸 支出合同(我付分包/供应商)' }] },
          { key: 'amount', label: '合同金额', type: 'number', required: true, step: '0.01', placeholder: '0.00' },
        ]},
        { key: 'party', label: '对方单位', type: 'text', required: true, placeholder: '甲方/分包方名称' },
        { type: 'row', fields: [
          { key: 'projectId', label: '关联项目', type: 'select', options: [{ value: '', label: '不关联' }].concat(projs.map(p => ({ value: p.id, label: p.name }))) },
          { key: 'status', label: '状态', type: 'select', options: [{ value: 'active', label: '履行中' }, { value: 'completed', label: '已完成' }, { value: 'terminated', label: '已终止' }] },
        ]},
        { type: 'row', fields: [
          { key: 'signDate', label: '签订日期', type: 'date', required: true },
          { key: 'dueDate', label: '到期日期', type: 'date' },
        ]},
        { key: 'content', label: '合同要点', type: 'textarea', rows: 3, placeholder: '付款节点、违约条款、保修期等' },
      ],
      onSubmit: (d) => {
        d.companyId = cid;
        d.amount = parseFloat(d.amount) || 0;
        if (id) DB.update({ id, ...d }, 'contracts');
        else DB.add({ id: uid('ct'), ...d, received: 0, paid: 0 }, 'contracts');
        UI.toast('已保存', 'success');
        App.render();
      },
    });
  },
  pay(id) {
    const c = DB.contract(id);
    if (!c) return;
    UI.formModal({
      title: '记录收/付款',
      data: { amount: '', date: fmt.today(), note: '' },
      fields: [
        { key: 'amount', label: '本次金额', type: 'number', required: true, step: '0.01' },
        { key: 'date', label: '日期', type: 'date', required: true },
        { key: 'note', label: '备注', type: 'text', placeholder: '本次收款节点/方式' },
      ],
      onSubmit: (d) => {
        const amt = parseFloat(d.amount) || 0;
        if (amt <= 0) { UI.toast('金额必须大于0', 'error'); return; }
        if (c.type === 'income') c.received = (c.received || 0) + amt;
        else c.paid = (c.paid || 0) + amt;
        c.payments = c.payments || [];
        c.payments.push({ date: d.date, amount: amt, note: d.note });
        DB.update(c, 'contracts');
        // 同步生成一笔流水
        const tx = {
          id: uid('tx'),
          companyId: c.companyId,
          date: d.date,
          type: c.type === 'income' ? 'income' : 'expense',
          amount: amt,
          categoryId: c.type === 'income' ? 'ci_proj' : 'ce_sub',
          projectId: c.projectId || '',
          note: `[合同] ${c.name} - ${d.note || '收/付款'}`,
          createdAt: dates.now(),
        };
        DB.add(tx, 'transactions');
        UI.toast('已记录并生成流水', 'success');
        App.render();
      },
    });
  },
};

VIEWS.inventory = function () {
  const cid = Auth.companyId;
  const all = DB.inventory(cid);
  // 按材料名称+规格聚合库存余额
  const map = {};
  all.forEach(r => {
    const key = r.name + '|' + (r.spec || '');
    if (!map[key]) map[key] = { name: r.name, spec: r.spec || '', unit: r.unit || '个', in: 0, out: 0, totalCost: 0 };
    if (r.type === 'in') { map[key].in += r.quantity; map[key].totalCost += r.quantity * (r.price || 0); }
    else map[key].out += r.quantity;
  });
  const stocks = Object.values(map).map(s => ({ ...s, balance: s.in - s.out, avgPrice: s.in > 0 ? s.totalCost / s.in : 0 }));
  const logs = [...all].sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt)).slice(0, 30);
  return `
    <div class="content-padded">
      <div class="page-head">
        <div><div class="page-title">库存材料</div><div class="page-sub">当前 ${stocks.length} 种材料在库</div></div>
        <div>
          ${Auth.can('inventory') ? `<button class="btn btn-ghost" data-action="iv-new-in">📥 入库</button><button class="btn btn-accent" data-action="iv-new-out">📤 出库</button>` : ''}
        </div>
      </div>
      <div class="card mb-16"><div class="card-head"><div class="card-title">📦 库存余额</div></div>
        <div class="table-wrap"><table class="data">
          <tr><th>材料</th><th>规格</th><th class="text-right">累计入库</th><th class="text-right">累计出库</th><th class="text-right">当前库存</th><th>单位</th><th class="text-right">平均单价</th></tr>
          ${stocks.length === 0 ? `<tr><td colspan="7">${UI.empty('📦', '暂无库存')}</td></tr>` : stocks.map(s => `
            <tr${s.balance < 0 ? ' style="color:var(--c-red);"' : ''}>
              <td><b>${s.name}</b></td>
              <td>${s.spec || '—'}</td>
              <td class="text-right">${fmt.num(s.in)}</td>
              <td class="text-right">${fmt.num(s.out)}</td>
              <td class="text-right cell-amount"><b>${fmt.num(s.balance)}</b></td>
              <td>${s.unit}</td>
              <td class="text-right">${fmt.money(s.avgPrice, false)}</td>
            </tr>`).join('')}
        </table></div>
      </div>
      <div class="card"><div class="card-head"><div class="card-title">进出记录(近30条)</div></div>
        ${logs.length === 0 ? `<div class="card-body">${UI.empty('📋', '暂无进出记录')}</div>` : `
        <div class="table-wrap"><table class="data">
          <tr><th>日期</th><th>类型</th><th>材料</th><th class="text-right">数量</th><th>项目</th><th>备注</th></tr>
          ${logs.map(r => {
            const p = DB.project(r.projectId);
            return `<tr>
              <td>${fmt.short(r.date)}</td>
              <td>${r.type === 'in' ? '<span class="tag tag-green">入库</span>' : '<span class="tag tag-yellow">出库</span>'}</td>
              <td><b>${r.name}</b>${r.spec ? ' ' + r.spec : ''}</td>
              <td class="text-right">${fmt.num(r.quantity)} ${r.unit || ''}</td>

          }).join('')}

          <div class="text-sm text-muted">金额 ${fmt.money(inAmt, false)} · 税额 ${fmt.money(inTax, false)}</div>
        </div></div>
        <div class="card"><div class="card-body">
          <div class="text-sm text-muted">📤 销项发票(应税)</div>
          <div class="stat-value" style="color:var(--c-red);">${fmt.money(outAmt + outTax)}</div>
          <div class="text-sm text-muted">金额 ${fmt.money(outAmt, false)} · 税额 ${fmt.money(outTax, false)}</div>
        </div></div>
      </div>
      <div class="card"><div class="card-head"><div class="card-title">发票清单</div></div>
        ${list.length === 0 ? `<div class="card-body">${UI.empty('🧾', '暂无发票,记账时录入发票号可自动关联')}</div>` : `
        <div class="table-wrap"><table class="data">
          <tr><th>日期</th><th>类型</th><th>发票类型</th><th>发票号</th><th>对方</th><th class="text-right">金额</th><th class="text-right">税额</th><th class="text-right">价税合计</th>${Auth.can('invoices') ? '<th>操作</th>' : ''}</tr>
          ${list.map(i => `
            <tr>
              <td>${fmt.short(i.date)}</td>
              <td>${i.type === 'in' ? '<span class="tag tag-green">进项</span>' : '<span class="tag tag-blue">销项</span>'}</td>
              <td class="cell-note">${i.category || '—'}</td>
              <td class="cell-note">${i.number || '—'}</td>
              <td class="cell-note">${i.party || '—'}</td>
              <td class="text-right">${fmt.money(i.amount, false)}</td>
              <td class="text-right">${fmt.money(i.tax, false)}</td>
              <td class="text-right cell-amount"><b>${fmt.money((i.amount || 0) + (i.tax || 0), false)}</b></td>
              ${Auth.can('invoices') ? `<td><button class="btn btn-sm btn-ghost" data-action="inv2-edit" data-id="${i.id}">编辑</button> <button class="btn btn-sm btn-ghost" style="color:var(--c-red);" data-action="inv2-del" data-id="${i.id}">删</button></td>` : ''}
            </tr>`).join('')}
        </table></div>`}
      </div>
      <div class="card mt-16"><div class="card-body">
        <div class="text-sm text-muted mb-8">💡 增值税小知识(建筑行业常见)</div>
        <div class="text-sm">一般纳税人:建筑服务 9%、材料销售 13%、劳务 13%</div>
        <div class="text-sm">小规模纳税人:3%(简易计税)</div>
        <div class="text-sm text-muted">应纳税额 = 销项税额 - 进项税额。本年度累计:应缴 ${fmt.money(Math.max(0, outTax - inTax))}</div>
      </div></div>
    </div>`;
};

// 注册新模块到全局
window.Customers = Customers; window.Suppliers = Suppliers; window.Contracts = Contracts;
window.DailyLogs = DailyLogs; window.Inventory = Inventory; window.Invoices = Invoices;

// ====== 车辆管理 ======
const Vehicles = {
  form(id) {
    const cid = Auth.companyId;
    const v = id ? DB.vehicle(id) : { plate: '', model: '', type: '工程车', driver: '', buyDate: '', insurance: '', inspection: '', note: '' };
    if (!v) return;
    UI.formModal({
      title: id ? '编辑车辆' : '新增车辆',
      data: v,
      submitText: '保存',
      draftKey: id ? null : 'veh_new',
      fields: [
        { type: 'row', fields: [
          { key: 'plate', label: '车牌号', type: 'text', required: true, placeholder: '如:沪A12345' },
          { key: 'type', label: '类型', type: 'select', options: [{ value: '工程车', label: '工程车' }, { value: '面包车', label: '面包车' }, { value: '小货车', label: '小货车' }, { value: '私家车', label: '私家车' }, { value: '其他', label: '其他' }] },
        ]},
        { type: 'row', fields: [
          { key: 'model', label: '车型', type: 'text', placeholder: '如:五菱宏光 / 长城皮卡' },
          { key: 'driver', label: '司机', type: 'text' },
        ]},
        { type: 'row', fields: [
          { key: 'buyDate', label: '购入日期', type: 'date' },
          { key: 'insurance', label: '保险到期', type: 'date' },
        ]},
        { key: 'inspection', label: '年检到期', type: 'date' },
        { key: 'note', label: '备注', type: 'textarea', rows: 2, placeholder: '保养记录、维修情况等' },
      ],
      onSubmit: (d) => {
        d.companyId = cid;
        if (id) DB.update({ id, ...d }, 'vehicles');
        else DB.add({ id: uid('veh'), ...d }, 'vehicles');
        UI.toast('已保存', 'success');
        App.render();
      },
    });
  },
};
VIEWS.vehicles = function () {
  const cid = Auth.companyId;
  const list = DB.vehicles(cid);
  const today = fmt.today();
  const fuelLogs = DB.fuelLogs(cid);
  return `
    <div class="content-padded">
      <div class="page-head">
        <div><div class="page-title">车辆管理</div><div class="page-sub">共 ${list.length} 辆车</div></div>
        <div>${Auth.can('vehicles') ? `<button class="btn btn-accent" data-action="veh-new">+ 添加车辆</button>` : ''}</div>
      </div>
      ${list.length === 0 ? UI.empty('🚙', '还没有车辆') : `
      <div class="table-wrap"><table class="data">
        <tr><th>车牌</th><th>类型</th><th>车型</th><th>司机</th><th>保险到期</th><th>年检到期</th><th class="text-right">加油总额</th>${Auth.can('vehicles') ? '<th>操作</th>' : ''}</tr>
        ${list.map(v => {
          const totalFuel = fuelLogs.filter(f => f.vehicleId === v.id).reduce((s, f) => s + (f.amount || 0), 0);
          const insOverdue = v.insurance && v.insurance < today;
          const annOverdue = v.inspection && v.inspection < today;
          return `<tr>
            <td><b>${v.plate}</b></td>
            <td><span class="tag tag-gray">${v.type}</span></td>
            <td class="cell-note">${v.model || '—'}</td>
            <td class="cell-note">${v.driver || '—'}</td>
            <td${insOverdue ? ' style="color:var(--c-red);font-weight:600;"' : ''}>${v.insurance ? fmt.short(v.insurance) : '—'}</td>
            <td${annOverdue ? ' style="color:var(--c-red);font-weight:600;"' : ''}>${v.inspection ? fmt.short(v.inspection) : '—'}</td>
            <td class="text-right">${fmt.money(totalFuel, false)}</td>
            ${Auth.can('vehicles') ? `<td><button class="btn btn-sm btn-ghost" data-action="veh-edit" data-id="${v.id}">编辑</button> <button class="btn btn-sm btn-ghost" style="color:var(--c-red);" data-action="veh-del" data-id="${v.id}">删</button></td>` : ''}
          </tr>`;
        }).join('')}
      </table></div>`}
      ${Auth.can('vehicles') ? `<div class="mt-16"><button class="btn btn-accent" data-action="fuel-new">+ 加油记录</button></div>` : ''}
      ${fuelLogs.length === 0 ? '' : `
      <div class="card mt-16"><div class="card-head"><div class="card-title">⛽ 加油记录(近 20 条)</div></div>
        <div class="table-wrap"><table class="data">
          <tr><th>日期</th><th>车辆</th><th>加油站</th><th>油品</th><th class="text-right">升数</th><th class="text-right">单价</th><th class="text-right">金额</th>${Auth.can('vehicles') ? '<th>操作</th>' : ''}</tr>
          ${fuelLogs.slice(-20).reverse().map(f => {
            const v = DB.vehicle(f.vehicleId);
            return `<tr>
              <td>${fmt.short(f.date)}</td>
              <td>${v ? v.plate : '—'}</td>
              <td class="cell-note">${f.station || '—'}</td>
              <td>${f.fuelType || '—'}</td>
              <td class="text-right">${fmt.num(f.liters)}</td>
              <td class="text-right">${fmt.money(f.price, false)}</td>
              <td class="text-right cell-amount expense">-${fmt.money(f.amount, false)}</td>
              ${Auth.can('vehicles') ? `<td><button class="btn btn-sm btn-ghost" data-action="fuel-edit" data-id="${f.id}">编辑</button> <button class="btn btn-sm btn-ghost" style="color:var(--c-red);" data-action="fuel-del" data-id="${f.id}">删</button></td>` : ''}
            </tr>`;
          }).join('')}
        </table></div>
      </div>`}
    </div>`;
};

// ====== 加油记录 ======
const FuelLogs = {
  form(id) {
    const cid = Auth.companyId;
    const f = id ? (DB.data.fuelLogs || []).find(x => x.id === id) : { date: fmt.today(), vehicleId: '', liters: '', price: '', amount: '', station: '', fuelType: '92#', note: '' };
    if (!f) return;
    const vehicles = DB.vehicles(cid);
    UI.formModal({
      title: id ? '编辑加油记录' : '新增加油记录',
      data: f,
      submitText: '保存',
      draftKey: id ? null : 'fuel_new',
      fields: [
        { type: 'row', fields: [
          { key: 'date', label: '日期', type: 'date', required: true },
          { key: 'vehicleId', label: '车辆', type: 'select', required: true, options: vehicles.length === 0 ? [{ value: '', label: '请先添加车辆' }] : vehicles.map(v => ({ value: v.id, label: v.plate + (v.model ? ' ' + v.model : '') })) },
        ]},
        { type: 'row', fields: [
          { key: 'liters', label: '升数', type: 'number', required: true, step: '0.01', placeholder: '0.00' },
          { key: 'price', label: '单价(元/升)', type: 'number', required: true, step: '0.01', placeholder: '7.50' },
        ]},
        { type: 'row', fields: [
          { key: 'fuelType', label: '油品', type: 'select', options: ['92#', '95#', '98#', '0号柴油', '电力'].map(o => ({ value: o, label: o })) },
          { key: 'amount', label: '总金额', type: 'number', step: '0.01', placeholder: '自动计算' },
        ]},
        { key: 'station', label: '加油站', type: 'text', placeholder: '加油站名' },
        { key: 'note', label: '备注', type: 'textarea', rows: 2, placeholder: '里程数、用途(去哪个工地)等' },
      ],
      onSubmit: (d) => {
        d.companyId = cid;
        d.liters = parseFloat(d.liters) || 0;
        d.price = parseFloat(d.price) || 0;
        if (!d.amount) d.amount = d.liters * d.price;
        else d.amount = parseFloat(d.amount);
        if (id) DB.update({ id, ...d }, 'fuelLogs');
        else DB.add({ id: uid('fl'), ...d, createdAt: dates.now() }, 'fuelLogs');
        // 同步生成一笔交通支出流水
        if (!id) {
          const v = DB.vehicle(d.vehicleId);
          DB.add({
            id: uid('tx'), companyId: cid, date: d.date, type: 'expense',
            amount: d.amount, categoryId: 'ce_transport', projectId: '',
            note: `加油:${v ? v.plate : ''} ${d.liters}L@${d.price} (${d.station || ''})`,
            createdAt: dates.now(),
          }, 'transactions');
        }
        UI.toast('已保存并生成加油流水', 'success');
        App.render();
      },
    });
  },
};

// 注册车辆模块到全局
window.Vehicles = Vehicles; window.FuelLogs = FuelLogs;

/* ========== 启动 ========== */
document.addEventListener('DOMContentLoaded', async () => {
  await App.init();
});
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
